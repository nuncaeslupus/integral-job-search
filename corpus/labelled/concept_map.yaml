# Step 2 of the corpus read pass, as data — the rule table `suggestions.json`
# describes in prose but does not carry.
#
# The read pass (`corpus/labelled/suggestions.json`) ran in two separated steps.
# Step 1 named, in the advert's own words, every property of the offer a candidate
# could weigh, with no dimension id anywhere in its output. Step 2 mapped those
# names onto the dimension model, and whatever no rule reached was recorded with
# `dimension: null`. That separation is what makes `ontology_hit_rate` a reading of
# the market rather than of how the reader was briefed, and it is why the mapping
# has to live outside the read pass: rewriting step 1's entries would destroy the
# only record of what the model could not name.
#
# So this file is step 2's rule table, re-run against the widened model (T57). Each
# key is a dimension the model actually declares; each value is a concept name the
# read pass stated and could not place. `integral.ontology_health` refuses the whole
# file if a key is not a real dimension, or if a concept is not one the source
# itself declares under its top-level `unmapped` key — a map that could invent
# either would raise the hit rate without widening anything, which is the exact
# failure the metric exists to catch.
#
# A concept absent from this file stays **unmapped**, and that is the honest state:
# 156 occurrences across 122 names still are, and they are the staleness signal.

