name: tag-release

# push: the normal path — tag as soon as a version bump lands on main.
# schedule + workflow_dispatch: the recovery path. A push-only trigger fires
# exactly once, so if Actions is unavailable at merge time (no runners, an
# outage, a spending limit) the release ships UNTAGGED and stays that way —
# nothing re-fires, and every consumer's tag-gated check_update.sh keeps
# reporting the previous version as latest. That happened to v0.21.0 (and
# v0.20.4 before it). The daily run re-derives the tag from .bundle-version and
# creates it if missing, so a missed release self-heals once Actions recovers;
# it is a no-op on every other day.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize tag creation so two quick pushes to main can't race the same ref.
concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag from .bundle-version
        run: |
          set -euo pipefail
          vfile=plugins/core/skills/init/assets/.bundle-version
          if [[ ! -f "${vfile}" ]]; then
            echo "::error::${vfile} is missing — cannot determine the release version." ; exit 1
          fi
          version=$(tr -d '[:space:]' < "${vfile}")
          if [[ -z "${version}" ]]; then
            echo "::error::${vfile} is empty — cannot determine the release version." ; exit 1
          fi
          tag="v${version}"

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — nothing to release (version was not bumped)."
            exit 0
          fi

          # Monotonicity: refuse to publish a version that is not strictly greater
          # than the latest existing tag (guards a lowered/rolled-back version).
          latest=$(git tag -l 'v*.*.*' | sed 's/^v//' | sort -V | tail -1 || true)
          if [[ -n "${latest}" ]]; then
            highest=$(printf '%s\n%s\n' "${version}" "${latest}" | sort -V | tail -1)
            if [[ "${version}" != "${highest}" ]]; then
              echo "::error::.bundle-version ${version} is lower than the latest tag v${latest}; refusing to tag." ; exit 1
            fi
          fi

          git config user.email "noreply@github.com"
          git config user.name "github-actions[bot]"
          git tag "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "Created tag ${tag}"
