[project]
name = "claude-arsenal"
version = "0.1.0"
description = "Claude Code marketplace shipping the skill-creator meta-skill plus the core workflow plugin."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
embeddings = ["sentence-transformers>=2.2"]
colour = ["termcolor>=2.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-Markdown>=3.7",
    "termcolor>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "plugins/**",
    ".claude-plugin/**",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "RUF", "B", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Generates an HTML/CSS/JS reader from embedded template strings — long lines
# are inherent to that markup, and its info/warning glyphs are intentional
# stderr output, not ambiguous identifiers.
"plugins/core/skills/specify/scripts/create_reader.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["plugins"]
