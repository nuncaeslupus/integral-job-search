# Keys `integral.connectors.names_a_credential` must judge, and how.
#
# Written from the rule and not from the matcher: "a connector may not carry a
# credential" (`connectors.py`'s module docstring, "What a connector may not
# do"), so a key that names one is refused wherever a request can carry it —
# in `body_json` and, since the same audit, in `url_pattern`'s query string.
#
# Both lists are load-bearing and they fail in opposite directions:
#
# * `refused` is the FAIL-OPEN side. A key admitted here is a secret committed
#   into a library other people borrow from, and no later check catches it.
#   Nearly every entry below was ADMITTED before the audit that produced this
#   file: the splitter could not break a capital run (`SECRETKEY`) or a
#   lowercase concatenation (`apitoken`), and a dozen ordinary words for a
#   secret were simply absent from the token list (`pwd` was, `passwd` was
#   not — one letter apart).
#
# * `accepted` is the FAIL-CLOSED side, and it exists because a matcher that
#   says no to everything passes the first list perfectly. It is deliberately
#   thin on near-misses: `sortKey`, `cache_key`, `primary_key` and
#   `idempotency_key` ARE refused today and are not listed here, because a
#   board losing one ordinary search field costs a fetch, while a leaked key
#   costs whoever minted it.

refused:
  # Already caught before the audit — listed so a repair cannot regress them.
  - api_key
  - apiKey
  - X-Api-Key
  - apikey
  - token
  - accessToken
  - sessionId
  - secret
  - password
  - passwd
  - authorization
  - Authorization
  - bearer
  - cookie
  - Cookie
  - credentials

  # A lowercase concatenation with no separator to split on. `apikey` was in
  # the token list, which is this class seen once and patched one member deep.
  - apitoken
  - authtoken
  - accesstoken
  - secretkey
  - apisecret
  - privatekey
  - sessionid
  - publickey
  - clientsecret
  - refreshtoken

  # A run of capitals: no lowercase→uppercase boundary anywhere in it.
  - SECRETKEY
  - ACCESSTOKEN
  - APITOKEN
  - JSESSIONID
  - PHPSESSID
  - .ASPXAUTH

  # Ordinary words for a secret that the token list did not hold.
  - pass
  - pwd
  - user_pwd
  - passphrase
  - signature
  - X-Signature
  - hmac
  - jwt
  - sig
  - salt
  - otp
  - nonce
  - csrf
  - csrf_token
  - xsrf

  # The identifier half of a credential pair. It authorises nothing alone,
  # which is why it reads as harmless — and idealist.org's Algolia call needs
  # both halves, so committing one is committing half of someone's key.
  - appid
  - app_id
  - client_id
  - clientId
  - applicationId
  - x-algolia-api-key
  - x-algolia-application-id

accepted:
  # A board's ordinary search vocabulary. Every one of these is a real key
  # from a connector committed here, from the usajobs POST body, or from a
  # ledger entry's recorded curl.
  - Keyword
  - keyword
  - keywords
  - ResultsPerPage
  - Page
  - page
  - pagina
  - locationName
  - location
  - Title
  - Summary
  - PositionURI
  - lang
  - onlyActive
  - currency
  - q
  - query
  - search
  - term
  - what
  - where
  - sort
  - order
  - limit
  - offset
  - count
  - size
  - category
  - company
  - remote
  - salary
  - contract_type
  - date_posted
  - id
  - job_id
  - offer_id
  - identifier
  - username
  - name
  # Words that merely CONTAIN a credential word. A substring search refuses
  # every one of these, which is why the matcher breaks a key into whole words
  # and requires the break to be total.
  - monkey
  - donkey
  - whiskey
  - turkey
  - passenger
  - bypass
  - design
  - signal
  - apiary
