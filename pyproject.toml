[project]
name = "integral-job-search"
version = "0.1.0"
description = "Candidate-centred integral job search: one dimension model, carried end to end."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only `tools/collect_ads.py` needs these. Reading and validating the committed
# corpus (`integral.corpus`) is stdlib-only, so the T4b gate runs without them.
collect = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "py3langid>=0.3",
    "requests>=2.32",
]
# Only `integral.cv_store`'s PDF importer needs this. DOCX is a zip of XML —
# stdlib `zipfile` + `xml.etree` read it directly — and the S4 gate
# (`intake_field_provenance`) is measured over the DOCX-import and
# build-from-nothing paths, neither of which needs it, so it runs without
# this extra. Installing it enables PDF import too; without it, importing a
# PDF reports a clean "unavailable" outcome instead of crashing.
cv = [
    "pypdf>=4.0",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    # ~3,900 tests. `make test` runs them 3x to 5x faster on a twelve-core
    # laptop, under `-n auto` from the Makefile and `--dist loadfile` from
    # [tool.pytest.ini_options] below — which says why each flag is where it is.
    # Every review round pays the serial cost several times over
    # (`make host-gate`, then `tools/verified_gate.sh`).
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integral"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored, generated trees. `.claude/skills/` is rewritten wholesale by
# `make update-skills`, and `claude-arsenal/bin|scripts/` is refreshed by
# init.py whenever a checksum drifts from the plugin source — so a fix applied
# here is reverted at the next session start. They are upstream's code to lint;
# defects found in them go to nuncaeslupus/claude-arsenal as issues.
extend-exclude = [
    ".claude/skills",
    "claude-arsenal/bin",
    "claude-arsenal/scripts",
    # The claude-arsenal subtree (S9). Upstream's whole repository, vendored at
    # its own prefix so `git subtree pull` has somewhere to land. Linting it
    # would report on code this project cannot fix and would revert at the next
    # upgrade — the same reason the assembled bundle above is excluded. Defects
    # found here go upstream as issues.
    "vendor",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "B",   # flake8-bugbear (real bug patterns)
    "SIM", # flake8-simplify (cleaner equivalents)
    "PTH", # flake8-use-pathlib (prefer Path.open over open)
]

[tool.mypy]
python_version = "3.12"
# The plan and the lint target both promise *strict* mypy. The enumerated flags
# below are the arsenal canonical set, but they are a subset of `strict`, which
# also brings disallow_any_generics, disallow_untyped_calls,
# disallow_subclassing_any, no_implicit_reexport and strict_equality. Advertising
# strict while configuring less is the kind of gap the gate exists to catch, so
# the preset is enabled and the explicit flags are kept as documentation of the
# floor we will not drop below.
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
# Same exclusions as ruff, for the same reason: these trees are regenerated
# (`make update-skills`, `init.py`) so a fix here is reverted, and they are
# upstream's code to type. tools/ is repo automation rather than shipped code.
# Excluded rather than weakening the flags for src/, which is what strict is for.
exclude = [
    "^tools/",
    # Scratch scripts for a single session, gitignored and never imported by
    # anything under src/. ruff already skips them via .gitignore; mypy does
    # not read .gitignore, so it is named here.
    "^tmp/",
    "^\\.claude/skills/",
    "^claude-arsenal/bin/",
    "^claude-arsenal/scripts/",
    # The claude-arsenal subtree (S9) — upstream's code, replaced wholesale on
    # every `make arsenal-upgrade`. See the ruff note above.
    "^vendor/",
]

[tool.pytest.ini_options]
# `--dist loadfile` and deliberately not `-n auto`. addopts applies to every
# invocation in the repo, including the single-file gate calls most task files
# and CONTRIBUTING.md use (`pytest tests/test_x.py`), and `-n auto` would make
# each of those start twelve workers to run one file — so `-n` stays in the
# Makefile. `--dist` alone is inert without workers, which is what makes this
# line free: measured on this tree, a single-file run is byte-for-byte what it
# was (25 tests, 18.3s, no worker spawned), and a gate naming a file that does
# not exist still gets `ERROR: file or directory not found` at exit 4 rather
# than the weaker `no tests ran`.
#
# What it buys is the one thing a recipe cannot pin. `make test`'s parallelism
# is only safe file-by-file — tests/test_repo_gate.py is the sole place in the
# suite that writes into the live working tree — and nothing in this repository
# reads a Makefile recipe body, so the flag written there was unenforced by
# construction. Here it holds for every `-n` run, including one somebody types
# by hand.
addopts = "--dist loadfile"
testpaths = ["tests"]
pythonpath = ["src"]
