[project]
name = "jobsearch"
version = "0.1.0"
description = "Candidate-centred integral job search: one dimension model, carried end to end."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearch"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored, generated trees. `.claude/skills/` is rewritten wholesale by
# `make update-skills`, and `claude-arsenal/bin|scripts/` is refreshed by
# init.py whenever a checksum drifts from the plugin source — so a fix applied
# here is reverted at the next session start. They are upstream's code to lint;
# defects found in them go to nuncaeslupus/claude-arsenal as issues.
extend-exclude = [
    ".claude/skills",
    "claude-arsenal/bin",
    "claude-arsenal/scripts",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "B",   # flake8-bugbear (real bug patterns)
    "SIM", # flake8-simplify (cleaner equivalents)
    "PTH", # flake8-use-pathlib (prefer Path.open over open)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
# tools/ is repo automation, not shipped code, and drives arsenal scripts that
# are themselves untyped. Excluded from the package typecheck rather than
# weakening the flags for src/.
exclude = ["^tools/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
