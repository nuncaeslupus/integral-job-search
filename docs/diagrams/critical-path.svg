<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 623.001" role="img" aria-labelledby="ds8bc45f2a0c-title ds8bc45f2a0c-desc"><title id="ds8bc45f2a0c-title">The path to first signal</title><desc id="ds8bc45f2a0c-desc">The v1 critical path. Collecting ads depends on nothing and starts immediately; scaffolding through the corpus harness is the only thing standing between those ads and the human labelling task that gates both measurable extraction and elicitation.</desc><path d="M 364.725 79.784 L 364.725 134.541" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="364.725,134.541 358.725,121.207 370.725,121.207" fill="currentColor" stroke="none"/><path d="M 349.134 183.567 L 349.134 207.567 L 274.771 207.567 L 274.771 231.567" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="274.771,231.567 268.771,218.234 280.771,218.234" fill="currentColor" stroke="none"/><path d="M 380.316 183.567 L 380.316 207.567 L 454.68 207.567 L 454.68 231.567" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="454.68,231.567 448.68,218.234 460.68,218.234" fill="currentColor" stroke="none"/><path d="M 274.771 280.594 L 274.771 304.594 L 306.472 304.594 L 306.472 328.594" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="306.472,328.594 300.472,315.261 312.472,315.261" fill="currentColor" stroke="none"/><path d="M 454.68 280.594 L 454.68 304.594 L 342.761 304.594 L 342.761 343.303" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="342.761,343.303 336.761,329.969 348.761,329.969" fill="currentColor" stroke="none"/><path d="M 189.966 86.541 L 189.966 304.594 L 270.183 304.594 L 270.183 343.303" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="270.183,343.303 266.583,335.303 273.783,335.303" fill="currentColor" stroke="none"/><path d="M 270.183 411.94 L 270.183 475.585 L 116.643 475.585 L 116.643 494.919" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="116.643,494.919 110.643,481.585 122.643,481.585" fill="currentColor" stroke="none"/><path d="M 299.708 423.907 L 299.708 494.919" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="299.708,494.919 293.708,481.585 305.708,481.585" fill="currentColor" stroke="none"/><path d="M 342.761 411.94 L 342.761 450.649 L 503.066 450.649 L 503.066 474.649" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><rect x="114.586" y="24" width="150.76" height="62.541" rx="31.27" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="189.966" y="44.222" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">T4b Collect 100 raw</tspan></text><text x="189.966" y="57.736" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">ads</tspan></text><text x="189.966" y="71.249" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>ES / EN / CA, no labels</tspan></text><rect x="37.11" y="494.919" width="159.066" height="49.027" rx="24.514" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="116.643" y="515.141" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">T15 Extraction</tspan></text><text x="116.643" y="528.654" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>macro-F1 &gt;= 0.75</tspan></text><rect x="376.725" y="231.567" width="155.909" height="49.027" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="454.68" y="251.79" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">T4 Corpus harness</tspan></text><text x="454.68" y="265.303" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>labelling CLI, split</tspan></text><polygon points="306.472,328.594 427.436,377.621 306.472,426.649 185.508,377.621" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="306.472" y="373.33" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">T5 Label the corpus</tspan></text><text x="306.472" y="386.844" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">[HUMAN] — the bottleneck</tspan></text><rect x="196.816" y="231.567" width="155.909" height="49.027" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="274.771" y="251.79" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">T3 Dimension model v0</tspan></text><text x="274.771" y="265.303" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>20-25 dimensions</tspan></text><rect x="220.175" y="494.919" width="159.066" height="49.027" rx="24.514" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="299.708" y="515.141" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">T9 Reaction elicitation</tspan></text><text x="299.708" y="528.654" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>overlap == 0</tspan></text><rect x="289.346" y="30.757" width="150.76" height="49.027" rx="24.514" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="364.725" y="50.979" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">T1 Scaffold</tspan></text><text x="364.725" y="64.492" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>uv, ruff, mypy, pytest</tspan></text><rect x="286.771" y="134.541" width="155.909" height="49.027" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="364.725" y="154.763" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">T2 Dimension schema</tspan></text><text x="364.725" y="168.276" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">the shared vocabulary</tspan></text><text x="503.066" y="494.871" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>Everything numeric queues behind</tspan></text><text x="503.066" y="508.384" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>T5. Only the labelling needs</tspan></text><text x="503.066" y="521.898" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>judgement — collection does not,</tspan></text><text x="503.066" y="535.411" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>which is why it is split out and</tspan></text><text x="503.066" y="548.925" font-family="'DejaVu Sans', sans-serif" font-size="10.01" fill="currentColor" text-anchor="middle"><tspan>starts first.</tspan></text><text x="95.704" y="198.718" font-family="'DejaVu Sans', sans-serif" font-size="9.1" fill="currentColor">starts now, no deps</text><text x="320" y="607.509" font-family="'DejaVu Sans', sans-serif" font-size="9.1" fill="currentColor" text-anchor="middle"><tspan>Heavy arrows are the critical path. T5 needs the candidate personally.</tspan></text></svg>