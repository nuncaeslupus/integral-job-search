# CI for the integral-job-search tool.
#
# This repository's whole method is that a claim carries a measurement: every
# task declares a numeric gate, writes its evidence to `status/evidence/`, and
# is only recorded done once that evidence clears the threshold. Until now none
# of that ran anywhere but a developer's machine, which means the guarantee was
# only ever as good as the last person who remembered to run `make`.
#
# So the four jobs below are not a generic Python pipeline with the gates
# bolted on. Two of them exist specifically to keep the evidence honest:
#
#   evidence      — regenerates every module's measurement and fails on any
#                   diff, so a committed number cannot quietly stop being what
#                   the code actually measures.
#   verify-gates  — asserts every task the ledger calls done or merged can
#                   still show a measurement clearing its declared threshold,
#                   so a later commit cannot break an earlier task's gate in
#                   silence.
#
# They are separate jobs rather than steps in one, because "the number is
# stale" and "the number fails its gate" are different failures and a reviewer
# should be able to tell which happened without opening a log.

name: CI

on:
  push:
    # `main` only. This read `branches: ["**"]`, and every push to a branch with
    # an open pull request therefore fired BOTH this event and `pull_request`
    # for the same commit — two complete runs of all four jobs. The concurrency
    # group below could not collapse them, because `github.ref` is
    # `refs/heads/<branch>` for one and `refs/pull/<n>/merge` for the other, so
    # they land in different groups and neither cancels the other. Measured on
    # 2026-09-04: head `768bdca` produced runs 33865668467 and 33865671756, both
    # named CI, both running lint, test, evidence and verify-gates.
    #
    # Roughly half the account's 2000 monthly minutes bought nothing, and they
    # ran out four days into the billing period. A pull-request branch is still
    # covered — by `pull_request` — so nothing is lost but the duplicate.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push supersedes the first; nobody needs CI for a commit that has
  # already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep uv's cache off the default location so actions/cache handles it.
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: ruff + strict mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, in every job. reader_notes (T31) resolves each
          # note back to the commit that last set its text and reparses the
          # spec there; a shallow checkout does not make it fail, it makes
          # it stop measuring. At depth 1 that walk finds only the tip, so
          # every note trivially resolves to today's title and all 28 report
          # `unchanged` — a clean result over nothing, which is the one thing
          # a gate in this repository may never do.
          #
          # It stays green either way, which is exactly why this is pinned
          # by a test rather than left to whoever edits this file next.
          # actions/checkout defaults to depth 1; confirmed by cloning this
          # repository --depth 1 and reproducing the behaviour.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Pin the interpreter the project declares
        run: uv python install 3.12
      - run: make lint

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, in every job. reader_notes (T31) resolves each
          # note back to the commit that last set its text and reparses the
          # spec there; a shallow checkout does not make it fail, it makes
          # it stop measuring. At depth 1 that walk finds only the tip, so
          # every note trivially resolves to today's title and all 28 report
          # `unchanged` — a clean result over nothing, which is the one thing
          # a gate in this repository may never do.
          #
          # It stays green either way, which is exactly why this is pinned
          # by a test rather than left to whoever edits this file next.
          # actions/checkout defaults to depth 1; confirmed by cloning this
          # repository --depth 1 and reproducing the behaviour.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: make test

  evidence:
    name: evidence is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, in every job. reader_notes (T31) resolves each
          # note back to the commit that last set its text and reparses the
          # spec there; a shallow checkout does not make it fail, it makes
          # it stop measuring. At depth 1 that walk finds only the tip, so
          # every note trivially resolves to today's title and all 28 report
          # `unchanged` — a clean result over nothing, which is the one thing
          # a gate in this repository may never do.
          #
          # It stays green either way, which is exactly why this is pinned
          # by a test rather than left to whoever edits this file next.
          # actions/checkout defaults to depth 1; confirmed by cloning this
          # repository --depth 1 and reproducing the behaviour.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Regenerate every gate's evidence and refuse any drift
        run: make evidence
      - name: Show what changed when it drifts
        if: failure()
        run: git --no-pager diff status/evidence/

  verify-gates:
    name: every done task can show its measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, in every job. reader_notes (T31) resolves each
          # note back to the commit that last set its text and reparses the
          # spec there; a shallow checkout does not make it fail, it makes
          # it stop measuring. At depth 1 that walk finds only the tip, so
          # every note trivially resolves to today's title and all 28 report
          # `unchanged` — a clean result over nothing, which is the one thing
          # a gate in this repository may never do.
          #
          # It stays green either way, which is exactly why this is pinned
          # by a test rather than left to whoever edits this file next.
          # actions/checkout defaults to depth 1; confirmed by cloning this
          # repository --depth 1 and reproducing the behaviour.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: make verify-gates
