# claude-arsenal host configuration — yours; upstream never rewrites this file.

# How far must a task PR get before it may be merged?
#   always | after-review | after-ci | after-ci-and-review | never
#
# `after-review`, added in claude-arsenal v0.30.0 for this repository's exact
# situation (claude-arsenal#166): GitHub Actions had no runner minutes, so every
# job on every head failed in seconds with no runner ever assigned — CI was not
# red about the code, it was not reporting at all. `after-ci` against a CI that
# can only be red is either a block on every merge for the duration or a rule
# everyone learns to wave through, and the second is what actually happens.
#
# **That premise expired on 2026-09-01** — runs complete in ~56 seconds with real
# conclusions — and T103 flipped this to `after-ci-and-review` on 2026-09-02. It
# was not a one-line edit here, because it depended on T101: the first real
# conclusion found a job that had been failing on its own account since #123, and
# making a red check blocking while that class of fault is undetected wedges the
# repository. T101 landed, `ci_targets_missing_from_makefile` reads 0, and the
# latest `CI` run on `main` had concluded `success` — the two preconditions
# `integral.merge_policy` re-reads on every `make evidence`, so this value cannot
# quietly outlive the conditions it was set under.
#
# This is not a weakened `after-ci-and-review`; it is the other axis. `after-ci`
# is "the machines agree"; `after-review` is "a reader agrees" — and the reader
# may be a bot. Which bot has changed four times here already, which is exactly
# why **none is named in this file**: a policy that names its reviewer blocks
# forever the day the repo swaps one for another. Read the PR's reviews and take
# whatever GitHub reports there.
#
#   ci      every required check on the PR head has concluded green on GitHub
#           Actions. Not `make ci` run locally, however identical the commands:
#           the line below already draws that distinction, and this is the half
#           of the policy that rests on it.
#
#   review  a review has landed, every finding it raised is verified against the
#           code, the real ones are fixed and the rest answered on the thread —
#           and then **the session merges**, with no further sign-off. Waiting
#           for a human after that is the same failure as merging early: this
#           file already answered the question. An unread bot review is not a
#           review, and a green summary line is not the finding list.
#           → claude-arsenal/references/github-automation.md, "Who fixes, and
#             who merges"
#
# Independently of this policy, the five gates are still run locally on every PR
# head — `make ci` — and their results quoted on the PR. That is a pre-merge
# check this repo runs regardless. It is deliberately no longer *called* CI
# here: the note this block replaces redefined "ci" to mean the local run,
# which put load-bearing policy in prose that nothing validates, and a local run
# is not the same assertion as a green CI however identical the commands.
#
merge-policy = "after-ci-and-review"

# The repo's own aggregate gate, as a command. Declared for v2.4.0, which reads
# this key in two places that were previously guesswork:
#
#   * `bin/rebase_stack.sh` regenerates an evidence-only rebase conflict by
#     running it, instead of stopping (`claude-arsenal#210`). Evidence files are
#     build products — `status/evidence/T55.json` counts tracked files, so it
#     conflicts on *every* rebase here — and the right content is neither side,
#     it is what the code measures on the resulting tree.
#   * `bin/open_task_pr.sh` runs it as a hard precondition, which is the
#     enforcement point D-22 found missing: the five-command gate `CLAUDE.md`
#     requires before a merge was enforced by nothing, since Actions had no
#     runner minutes and the helper only ran the task's own payload gate.
#
# `make host-gate` and not `make ci`: `integral.repo_gate` asserts that every
# target `CLAUDE.md` lists is real and is reached by this one (D-22), so a fifth
# line added there cannot quietly go unrun.
host-gate = "make host-gate"

# test-first writes a failing test before the change; test-after writes tests
# alongside it.
test-discipline = "test-first"

# What /session-end leaves behind: handoff | ticket | none
session-end = "handoff"

# The skills-listing character budget the auditor enforces. Raise it if your
# surface's real budget differs, rather than deleting skills to fit a number
# that is not yours.
#
# **13,000, raised from 8,000 on 2026-08-20 (S10).** Thirteen step skills (S7)
# put this library structurally past upstream's default: 32 skills measured
# 11,686 chars before test mode, and no amount of trimming fits thirteen
# deliberately-adjacent descriptions into the ~989 chars that would have been
# left. The owner's decision was to raise the budget rather than hide twelve
# steps behind a dispatcher, because knowing step 9 exists is part of knowing
# step 8 is the wrong one to load.
#
# What it costs, stated so nobody has to reconstruct it: ~13KB of context on
# every turn of every session. Revisit it when the library grows — that is the
# price of a budget that is chosen rather than fitted.
#
# `integral.skill_budget` reads this key and measures against it, and refuses
# a value that is not a round multiple of 1,000 or that leaves under 400 chars
# of headroom — so it cannot be quietly reset to whatever the library happens
# to measure. `audit_library.py` still uses upstream's hardcoded 8,000
# (claude-arsenal#143 asks it to read this key), which is why it reports a
# listing-budget finding here by design; the total it prints is the number our
# own measurement is asserted against.
listing-budget = 11000
queue-automation = true

# What a worker runs in its fresh worktree before the first gate — v3.3.0 reads
# this key and `bin/host_setup.sh` runs it. A worktree is a checkout: it carries
# tracked files and nothing an install produces, so `.venv/` is absent and the
# first `uv run` in each one pays for a full resolve, or fails outright. Naming
# it here means each worker does that once, deliberately, instead of diagnosing
# it separately — which is what five of nine workers did in the session upstream
# took this from.
#
# `uv sync` and not `make sync`: the two are the same command today, and this one
# does not depend on the Makefile being present and correct at the moment the
# worktree is first entered — which is the moment the whole feature exists to make
# survivable.
#
# `--locked` is the part that is not obvious, and it is here because of how it
# interacts with `host_setup.sh`. Plain `uv sync` silently re-resolves and rewrites
# a stale `uv.lock`; `host_setup.sh` then reverts that rewrite, because keeping the
# install's churn out of the task diff is its whole job. The two are individually
# right and together produce a worker running against an environment resolved from
# dependencies recorded nowhere — and the evidence of it deleted in the same breath.
# `--locked` fails instead, which is the correct answer: a stale lockfile is a
# commit somebody owes, not something for a worktree to fix on the way past.
host-setup = "uv sync --extra dev --locked"

[skills]
extract = true
python = true
workflow = true

# Which model runs what. `workers` is written explicitly rather than left to the
# script default it already matched, because a default is not a decision anyone
# can see: reading this file gave no indication the key existed, and a session
# naming its own model on each dispatch was contradicting nothing it could find.
#
# **Setting it does not enforce it, and that is the point of the comment.** On
# 2026-09-08/09 about twenty agents ran on Opus while this resolved to `sonnet`,
# costing 3–4M tokens and two exhausted quota windows. Three things must hold for
# the value to arrive and on a cloud surface none does: the
# `CLAUDE_CODE_SUBAGENT_MODEL` export dies with its Bash call (shell state is not
# shared between calls there), an explicit `model:` on the dispatch outranks the
# env var regardless, and omitting `model:` inherits the *orchestrator's* model
# rather than falling back here. CLAUDE.md carries the operational rule for that
# reason — it is read every turn and this file is not.
#
# The owner's policy is implementers on Sonnet, second readers on Opus. Only the
# first half is below: `MODEL_KEYS` is `models.orchestrator` and `models.workers`,
# so there is no `models.reviewers` to set — `--get` exits 2 on it, and writing it
# here would be tolerated on read and wired to nothing, which is worse than an
# absence because it looks configured. Upstream change, tracked in CLAUDE.md.
[models]
workers = "sonnet"
