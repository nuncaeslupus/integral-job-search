# Factorial — an HR suite whose recruiting module gives each employer a career
# site at `https://<slug>.factorial.es` (Playtomic, Holaluz). The listing is
# server-rendered HTML: one `li.job-offer-item` per advert, with the advert's
# URL in `data-job-postings-url` and on the row's "Apply now" anchor. The row
# carries no body, so each advert's own page is read for `text`.
#
# robots.txt, read on 2026-11-25 on both tenants (playtomic, holaluz-1), is the
# same two lines: `User-agent: *` / `Allow: /`. Nothing is refused.
#
# Not here: `careers.factorial.com` (Factorial's own site) runs the same
# template on another host, so the `{employer}` slot cannot reach it.
site: factorial
locale: es
version: "1.0.0"
last_verified: "2026-11-25"
source_kind: employer
auth: none

list:
  url_pattern: "https://{employer}.factorial.es/"
  pagination:
    # Every open advert is on the one page; the template has no pager.
    mode: none
    max_pages: 1
  item: "li.job-offer-item"
  fields:
    detail_url:
      css: "a.buttonSecondary"
      attr: href
    title:
      css: ".factorial__headingFontFamily"
    # NOT declared: location. The row's team and location columns are two
    # divs with identical classes, and this grammar has no positional
    # selector, so any selector here would read the team name.
  employers:
    playtomic: Playtomic
    holaluz-1: Holaluz

detail:
  fields:
    title:
      css: "h1"
    # The advert body; one `div.styledText` per page, checked on both tenants.
    text:
      css: ".styledText"
