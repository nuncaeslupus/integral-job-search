# Boards worth a connector that do not have one yet — the complement of
# `ruled-out.yaml`.
#
# That file records boards already surveyed and refused, with the evidence. This
# one records boards nobody has surveyed, so that deciding *where to spend an
# hour* is not re-derived from scratch every session. An entry here is a
# candidate, never a promise: none of these has been fetched, none has had its
# robots.txt adjudicated, and none is known to be readable.
#
# **Nothing here is measured except the coverage gap.** The `rank` is a judgment
# with a stated basis, and the basis is written into each entry so a later reader
# can disagree with it on the record rather than guess at it. Saying so matters:
# a file of confident-looking rankings is exactly the shape of a measurement, and
# this is not one.
#
# What IS measured, on 2026-09-06, over the 18 committed packages:
#
#     ES  6      GLOBAL  7      US  2      PL  2      GB  1
#     DE  0      FR  0      IT  0      NL  0      PT  0
#
# Five European countries with a live job market have no connector at all. That
# gap is the whole reason for the ordering below — a board in a country with
# zero coverage buys more than the seventh board in a country with six.
#
# ---------------------------------------------------------------------------
# How to take one
#
# 1. Check it is not already in `ruled-out.yaml`. Two entries there were wrong,
#    and one was wrong twice, so a stale ruling is worth re-testing — but read
#    the `retest` line before spending the hour.
# 2. Survey it against the two tests that file states: robots (adjudicated with
#    the repo's own matcher, never a grep) and whether an anonymous GET returns
#    the advert text.
# 3. **Either outcome is a result.** A board that fails belongs in
#    `ruled-out.yaml` with its evidence and a `retest` command. Writing that
#    entry is the deliverable when there is no connector to write.
# 4. If it passes, `CONTRIBUTING.md` has the package rules — including the one
#    that cost two connectors their rot check (T127): the probe must name at
#    least one offer the fixture does not.
#
# `connector_packages()` filters on `is_dir()`, so nothing in the sourcing path
# reads this file. No gate parses it either. It is for the next reader.

listed: 2026-09-06
listed_by: "@nuncaeslupus"
surveyed: 2026-09-06

# ---------------------------------------------------------------------------
# The survey happened. Read this before the list.
#
# Twelve of the fourteen entries were surveyed on 2026-09-06 and nine are now
# rulings in `ruled-out.yaml`, each with its evidence and a retest line.
#
# **FR and NL are exhausted.** Every candidate this file listed for them is
# refused: francetravail.fr by robots, apec.fr an 11 KB empty shell, werk.nl
# behind an Oracle login, nationalevacaturebank.nl a 403. Those two countries
# do not need more work on these boards; they need a board nobody has named
# yet, which is a different task and is why they have no rows below.
#
# **Two boards passed both tests and are blocked on this repository**, not on
# themselves. They are under `blocked_on_engine`, and they are the concrete
# reason to do the engine work rather than an abstract argument for it.
# ---------------------------------------------------------------------------

blocked_on_engine:
  # Surveyed, robots-allowed, adverts served to an anonymous GET. Written up in
  # full under `engine_gap_selector` and `engine_gap_charset` in
  # `ruled-out.yaml`. Each becomes a connector the day its gap closes.
  - site: arbeitsagentur.de
    country: DE
    needs: "a selector that can take part of a text node"
    why_it_matters: "DE has zero connectors and this is the federal employment agency"
  - site: net-empregos.com
    country: PT
    needs: "a `charset` key on the connector, honoured by the fetcher"
    why_it_matters: >
      PT has zero connectors, and the gap is not specific to this board —
      legacy encodings survive longest on the non-English European boards,
      which is exactly where every remaining coverage gap is

wanted:
  - site: stepstone.de
    country: DE
    language: de
    rank: 2
    why: >
      Largest general German board; also serves AT and parts of NL/BE. Partly
      surveyed 2026-09-06: robots allows /jobs/python and the GET answers 200
      with 1.29 MB and 246 offer anchors, so it is server-rendered and worth
      the hour. Its fields were never mapped — that is the remaining work.
    surveyed: no

  - site: itjobs.pt
    country: PT
    language: pt
    rank: 3
    why: >
      Portuguese tech board. Partly surveyed 2026-09-06: robots allows
      /emprego, 200 with 69 KB and 124 offer anchors, repeated classes
      `list-group-item` (33) and `list-title` (18) that look like real cards.
      Check its charset first — its PT sibling net-empregos.com is ISO-8859-1
      and that is exactly what blocks it.
    surveyed: no

  - site: itjobs.it
    country: IT
    language: it
    rank: 3
    why: >
      Italian tech board, and the only IT candidate left: infojobs.it was
      surveyed and is a 3.9 KB empty shell, exactly as its ES sibling's
      already-written entry predicted it would be.
    surveyed: no

  - site: eures.europa.eu
    country: EU
    language: en
    rank: 1
    why: >
      One board covering every EEA country, so a single connector would touch
      every remaining gap at once. Surveyed 2026-09-06 and **not** resolved.
      The open question — whether it serves euraxess's refusing robots.txt —
      is answered: it does NOT, both paths tried are allowed. But
      /en/search-jobs is a 404, the old portal at
      europa.eu/eures/portal/jv-se/search answers 200 with 69 KB and zero offer
      anchors, and eures.europa.eu/index_en is a landing page. The search
      endpoint was not found; it was not proven absent. Highest value on this
      list and the least resolved.
    surveyed: no

  # welcometothejungle.com was here and has been removed: `ruled-out.yaml`
  # already refuses it under `robots_refused` (checked 2026-08-30, the search
  # path is disallowed). Caught by `test_no_wanted_board_was_already_ruled_out`
  # on its first run, which is the entire reason that check exists — an entry
  # like this costs the next reader an hour re-deriving a ruling that is
  # already written down. Left as a comment rather than deleted silently, so
  # the next person to think of it finds the answer here.
