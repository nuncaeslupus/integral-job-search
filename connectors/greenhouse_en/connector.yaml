    figma: Figma
    discord: Discord
    netlify: Netlify
    fastly: Fastly
    newrelic: New Relic
    honeycomb: Honeycomb.io
    planetscale: PlanetScale
    canonical: Canonical
    wikimedia: Wikimedia Foundation
    mozilla: Mozilla
    chainguard: Chainguard
    tailscale: Tailscale
    sourcegraph91: Sourcegraph
    typeform: Typeform
    wallapop: Wallapop
    launchdarkly: LaunchDarkly
    pagerduty: PagerDuty
    circleci: CircleCI
    jfrog: JFrog
    intercom: Intercom
    hubspotjobs: HubSpot
