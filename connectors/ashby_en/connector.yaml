# Ashby — an ATS host, not a job board (T144). One package, every employer
# named in `employers`.
#
# Host: api.ashbyhq.com, Ashby's public Job Postings API — the one it
# documents for employers to publish their own boards. Its /robots.txt answers
# 401, which RFC 9309 §2.3.1.3 calls "unavailable": a crawler MAY access any
# resource. `integral.robots` reads a 401 that way by the owner's decision of
# 2026-09-10. The board pages at jobs.ashbyhq.com disallow `/api/`, which is why
# this reads the posting API and not the page's own GraphQL.
#
# `includeCompensation=true` adds a `compensation` object, and beside the list
# this grammar cannot read — `summaryComponents` names salary, equity and bonus
# in no fixed order — the board publishes the salary alone, pre-formatted, in
# `scrapeableCompensationSalarySummary` (`"$165K - $330K"`). That is a plain
# string on a two-segment path, so the three fields below need no new grammar:
# `range_low`/`range_high` resolve a two-number band and refuse anything else,
# and `currency` refuses a symbol outside the closed table, so a board paying
# in a money this repository does not recognise reports no salary rather than a
# real figure in the wrong currency.
#
# T200: reais used to be that example. `fixture/list.html` carries
# `"R$170K - R$190K"`; the two numbers read fine and only the symbol did not,
# so the declaration-aware guard in `build_offer` dropped the whole band and
# this board published a salary nobody read. `R$` is now in `_CURRENCIES` and
# the row resolves to 170000–190000 BRL. The refusal the paragraph above
# describes is still real — it is just no longer about Brazil, because the
# table is closed and short rather than because reais are unreadable.
site: ashby
locale: en
version: "1.0.0"
last_verified: "2026-09-10"
source_kind: employer
auth: none

list:
  url_pattern: "https://api.ashbyhq.com/posting-api/job-board/{employer}?includeCompensation=true"
  pagination:
    mode: none
    max_pages: 1
  from_json:
    items: jobs
    fields:
      detail_url: jobUrl
      source_ref: id
      title: title
      location_raw: location
      text: descriptionPlain
      salary_min:
        path: compensation.scrapeableCompensationSalarySummary
        take: range_low
      salary_max:
        path: compensation.scrapeableCompensationSalarySummary
        take: range_high
      salary_currency:
        path: compensation.scrapeableCompensationSalarySummary
        take: currency
  # Postings carry no employer name, so this is where `company` comes from.
  employers:
    1password: 1Password
    airbyte: Airbyte
    anyscale: Anyscale
    astronomer: Astronomer
    baseten: Baseten
    buffer: Buffer
    clickhouse: ClickHouse
    coder: Coder
    cognition: Cognition
    cohere: Cohere
    cursor: Cursor
    decagon: Decagon
    deepl: DeepL
    deepnote: Deepnote
    docker: Docker
    dust: Dust
    elevenlabs: ElevenLabs
    gitbook: GitBook
    graphite: Graphite
    greptile: Greptile
    hex: Hex
    hightouch: Hightouch
    incident: incident.io
    langchain: LangChain
    linear: Linear
    livekit: LiveKit
    llamaindex: LlamaIndex
    lovable: Lovable
    mintlify: Mintlify
    modal: Modal
    n8n: n8n
    neon: Neon
    notion: Notion
    openai: OpenAI
    oyster: Oyster
    perplexity: Perplexity
    photoroom: Photoroom
    pinecone: Pinecone
    poolside: Poolside
    posthog: PostHog
    prefect: Prefect
    railway: Railway
    render: Render
    replit: Replit
    rerun: Rerun
    runway: Runway
    sentry: Sentry
    sierra: Sierra
    supabase: Supabase
    synthesia: Synthesia
    temporal: Temporal
    vanta: Vanta
    vapi: Vapi
    weaviate: Weaviate
    writer: Writer
    zapier: Zapier
    zed: Zed
