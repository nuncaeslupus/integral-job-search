# The Python Job Board — python.org/jobs. The single most on-target source in
# this library for a Python developer: every posting on it is a Python role by
# construction, so there is no "is this actually Python?" filtering to do
# afterwards.
#
# **Fetching gotcha, recorded because it cost a session real time:** the board
# serves `Content-Encoding: gzip` and does so even when the client did not ask
# nicely. `curl -sL https://www.python.org/jobs/` returns ~12 KB of binary and
# every selector matches nothing; `curl -sL --compressed` returns ~69 KB of
# clean HTML. Anything fetching this connector must decode the response body
# before handing it to the interpreter.
#
# robots.txt, fetched live 2026-08-30 and checked with this repo's own audited
# matcher (`integral.robots.Robots`, user agent `integral-job-search/0.1`, which
# falls into the `User-agent: *` group): `allows('https://www.python.org/jobs/')`
# and `allows('https://www.python.org/jobs/1234/')` both return True, crawl
# delay 1.0s. There is no AI-agent group on the file at all — no ClaudeBot,
# GPTBot, CCBot or anthropic-* rule. `*` disallows exactly `/~guido/orlijn/` and
# `/webstats/`; the other groups name HTTrack, puf, MSIECrawler, Krugle and
# Nutch, none of which is us.
site: pythonorg
locale: en
version: "1.0.0"
last_verified: "2026-10-05"
# Listings are public; reading them needs no account. Posting one does, which is
# not something this connector does.
auth: none

list:
  # The page key is the board's own emitted href (`?page=1`, `?page=2`), and
  # `probe/captured.json` records a live GET of `?page=2` (T152, 2026-10-05,
  # status 200, bytes and digest committed beside it), which is what
  # `integral.pagination_capture` requires before it lets the key stand (T113).
  # It was dropped once because the only capture was of the bare `/jobs/`.
  url_pattern: "https://www.python.org/jobs/?page={page}"
  pagination:
    mode: query_param
    param: page
    start: 1
    max_pages: 2
  # Counted, not eyeballed: `h2.listing-company` occurs exactly 25 times on the
  # live first page, matching the 25 `href="/jobs/<id>/"` links on it. This is
  # the board's own semantic class name, not a layout utility, so it should
  # survive a restyle better than the grid around it.
  #
  # It is *not* the natural item container — that is the bare `<li>` wrapping
  # it, which also carries the sibling `span.listing-job-type`,
  # `span.listing-posted` and `span.listing-company-category`. But the `<li>`
  # has no class or attribute of any kind, and this grammar has no descendant
  # combinator, so `li` as an item selector would also match the 47 `li.tier-2`
  # navigation entries and every other list item on the page (the remotive_en
  # trap: a too-loose item selector inventing blank "listings"). Selecting the
  # `h2` instead is the price: everything outside it — the teaser, the posted
  # date, the category — is unreachable from the list page. See `text` below.
  item: "h2.listing-company"
  fields:
    # First `a` in document order inside the `h2` is the title link. Checked by
    # parsing rather than by reading the markup: the only other anchor under the
    # `h2` is the location link inside `span.listing-location`, which comes
    # after it, and `span.listing-new` ("New", present on some rows) is a span,
    # not an anchor, so it never displaces the first match.
    detail_url:
      css: "a"
      attr: href
    title:
      css: "a"
    # The board writes the company as a **bare text node** after a `<br/>` inside
    # `span.listing-company-name`:
    #
    #     <span class="listing-company-name">
    #       <span class="listing-new">New</span>
    #       <a href="/jobs/8129/">Python developer</a><br/>
    #       Eleks
    #     </span>
    #
    # No element wraps "Eleks", so no selector returns it alone — but `take:
    # last_text_node` (#356) reads exactly the element's last text piece, which
    # is the employer here: the badge and the title are elements, and the loose
    # text after the `<br/>` comes last. (T236: this comment used to say the
    # grammar could not reach it and the connector published no employer; both
    # were wrong, and 8 of 16 stored offers carried a blank one.) The detail
    # page's `<title>` and `og:title` are compound, so the list is the place.
    company:
      css: "span.listing-company-name"
      take: last_text_node
    # One per listing, inside the `h2`. The board's location strings are free
    # text and often multi-city ("Vilnius / Kaunas / Warsaw, Lithuania/Poland"),
    # which is why this is `location_raw` and no `location_country` is claimed.
    location_raw:
      css: "span.listing-location"
    # No `text` here, deliberately. The list page's only teaser is the job-type
    # and posted-date line, and both are siblings of the `h2` this connector
    # uses as its item container — unreachable, per the `item` comment above.
    # `Connector` requires *some* selector to produce `text`, and the detail
    # block below does; the consequence is that this connector cannot produce an
    # offer from the list page alone, so a fetcher must follow `detail_url`.
    # `trabajos_es` carries a list-page teaser as a fallback for exactly that
    # case and this cannot; `remotive_en` is in the same position.

detail:
  # Proven, not assumed: `/jobs/8129/` was fetched live on 2026-08-30 and is
  # server-rendered Django HTML — `fixture/detail.html` is a raw slice of it.
  fields:
    # The whole advert body: job title, description, restrictions,
    # requirements, about-the-company and contact block, all inside one
    # `div.job-description`. Nothing else on the page carries that class.
    text:
      css: "div.job-description"
    # No `title` or `company` here on purpose. Detail fields win over list
    # fields on overlap in `build_offer`, and every candidate on this page is
    # *worse* than what the list already gives: the detail `h1.listing-company`
    # and `span.company-name` both fold the title, the "New" badge and the
    # company into one string, whereas the list page's title anchor is the clean
    # title. Declaring them would actively degrade the offer.
    # `location_raw` is likewise identical on both pages, so it is not repeated.
