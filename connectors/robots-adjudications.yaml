# Every robots adjudication this repository stands on, and — the part that was
# missing — whether the SECOND reader in it could have said no.
#
# `ruled-out.yaml`'s header states the rule: a path is admitted when the repo's
# own audited matcher (`integral.robots`, T70) says True, a second independent
# parser agrees, and a negative control shows some path on the same file coming
# back False. The second parser is stdlib `urllib.robotparser`.
#
# **CPython's `robotparser` returns the FIRST matching rule in file order, not
# RFC 9309 §2.2.2's longest match** — `Entry.allowance` iterates `rulelines` and
# returns on the first `applies_to` hit. So on any robots.txt that opens with
# `Allow: /`, it answers True for every path in the file, including every path a
# later, longer `Disallow` covers. It cannot refuse. Two matchers agreeing means
# something only when both can disagree, so on those files the rule silently
# became "the repo matcher decided" while the record said two parsers had.
#
# **T120 replaced that second reader.** `integral.second_reader` implements
# §2.2.1's group selection, §2.2.2's most-octets precedence and §2.2.3's `*` and
# `$`, and it was written from the RFC by a session that had not read
# `integral.robots` — a second reader derived from the same reading as the first
# is one matcher with two names. It is the reader a NEW adjudication gets.
#
# Two things that did not change, and both are the point:
#
#   * **Competence is still measured, per file, exactly as before.** A reader
#     believed competent because of who wrote it is the assumption T116 removed,
#     and it is not being reintroduced under a better parser's name. The four
#     verdicts stay, and `integral.second_reader` is put through the same
#     constructed files the stdlib is — including the three where it must NOT
#     improve on it (a bare `Disallow:`, two equivalent rules, and another
#     agent's group), because refusing a path RFC 9309 allows is the opposite
#     error and not competence.
#
#   * **Every row below is verified against the reader IT names**, not against
#     whichever reader the code now prefers. Each of these adjudications
#     consulted `urllib.robotparser`; re-checking those claims against a better
#     parser would certify an agreement that never happened, improving the
#     record without anyone re-running anything.
#
# **One standing below changed, and the honest count fell with it.**
# `foorilla.com` carries a committed robots.txt and stood as `single_parser`
# because the stdlib could not refuse anything on a file opening with
# `Allow: /`. Re-adjudicated on 2026-09-08 against `integral.second_reader` —
# 22 controls, all 22 refused, no false allows and no false refusals — it is a
# genuine agreement, so `robots_adjudications_without_a_competent_second_reader`
# reads **19** where T116 committed 20. No egress was involved: the file was
# already here.
#
# That is the whole of what T120 delivers on the ledger, and it is one board
# rather than eighteen because only three rows carry a `robots_txt:` snapshot
# (`usajobs.gov`, `landing.jobs`, `foorilla.com`) and the other two were already
# agreements. A competence verdict is a property of a FILE, so the remaining
# rows cannot be re-adjudicated until their files are in hand — which needs
# egress, and egress is 403 here.
#
# Every other standing below is untouched, for the reason in the bullet above:
# those rows consulted `urllib.robotparser`, and re-reading their claims with a
# better parser would improve the record without anyone re-running anything.
#
# That is fail-open in the exact component that exists as the independent check,
# which is why competence is now recorded rather than assumed. Each entry below
# carries a `standing`:
#
#   two_parsers_agreed          the second reader returned False for at least
#                               one path on THIS file that RFC 9309 also
#                               refuses. The only standing that counts as an
#                               agreement, and it must name where that refusal
#                               is written down.
#
#   single_parser               the second reader could not refuse anything on
#                               this file, or was never run. The adjudication is
#                               one parser's and is recorded as one parser's. Not
#                               a defect in the verdict — the repo matcher is
#                               strictly the stricter of the two — a defect in
#                               calling it an agreement.
#
#   no_negative_control_possible  the file disallows nothing this agent could be
#                               refused, so NO parser can produce a negative
#                               control on it. Distinct from "no control was
#                               run", which is what it used to be indistinguish-
#                               able from.
#
# `integral.connector_policy` reads this file (T116). Every directory under
# `connectors/` must appear here: a shipped package with no entry is a fetch
# admitted with no second reader at all, which is counted, not skipped — the
# metric must not be reachable by deleting rows.
#
# `checked` is the day the STANDING was determined, and `source` is the
# committed file the underlying reading is written in, so every row can be
# argued with rather than taken on trust.

adjudications:
  # ---------------------------------------------------------------------
  # The one standing that is an agreement.
  # ---------------------------------------------------------------------
  - site: usajobs.gov
    package: connectors/usajobs_en
    checked: 2026-09-04
    agent: "integral-job-search/0.1"
    standing: two_parsers_agreed
    second_reader: "urllib.robotparser"
    source: connectors/usajobs_en/meta.yaml
    allowed:
      - /Search/ExecuteSearch
      - /job/856726500
    second_reader_refused:
      - /Content/foo.css
      - /Scripts/app.js
    # RECONSTRUCTED from the reading committed in `connectors/usajobs_en/meta.yaml`
    # — "a single `User-agent: *` group with four Disallow lines — `/Content/`,
    # `/Scripts/`, `/foresee/` and `/Service References/`", checked against the
    # live file on 2026-09-02. It is that reading written back out as a robots.txt,
    # not a capture of the response body, and it is here so this row's standing and
    # both of its path lists are checked against a document instead of against its
    # own prose: `problems()` classifies it and requires the standing to match.
    # The other nineteen rows carry no snapshot because their files are not in this
    # repository and egress is blocked from the sessions that would fetch them —
    # which is why `_classify` had never run against a single real board.
    robots_txt: |
      User-agent: *
      Disallow: /Content/
      Disallow: /Scripts/
      Disallow: /foresee/
      Disallow: /Service References/
    reason: >
      The file is one `User-agent: *` group with four Disallow lines and no
      `Allow` at all, so first-match order and longest-match precedence cannot
      diverge on it: `/Content/foo.css` meets `Disallow: /Content/` under either
      rule. The second reader returned False there, so it demonstrably can
      refuse on this file, and the True verdicts beside it are an agreement.

