# Trabajos.com — the first connector in this library pointed at a real board.
# `examplejobs_es` is a worked example against a fictitious site; this one is
# read from markup somebody else controls, which is the whole point of T12.
#
# Why this board. Every other board the corpus collector already reads was
# ruled out, and the reasons are worth recording because they will come up
# again:
#
#   tecnoempleo.com   robots.txt names `ClaudeBot`, `Claude`, `anthropic-ai`,
#                     `Claude-Web`, `Claude-SearchBot` and `AnthropicBot` with
#                     `Disallow: /`. `meta.yaml` here has to assert
#                     `robots_txt: respected`; against that board it would be a
#                     false statement.
#   remoteok.com      same — a blanket `Disallow: /` for `ClaudeBot`.
#   weworkremotely,   permitted, but their listings are not in the served HTML:
#   remotive,         they are JSON APIs or JavaScript applications, and this
#   getmanfred,       engine matches CSS selectors against markup. There is
#   feinaactiva,      nothing on the page for a selector to find.
#   EURES
#
# trabajos.com serves its listings server-rendered, and its robots.txt
# disallows four specific paths (none of them these) with no AI-agent rule.
site: trabajos
locale: es
version: "1.0.0"
last_verified: "2026-09-10"
# Listings are public; reading them needs no account.
auth: none

list:
  # ponytail: one page, deliberately. The board pages by *offset* —
  # `&DESDE=41`, `&DESDE=81`, forty at a time — and `Pagination` can only
  # emit consecutive integers (`start + offset`), so a stride of 40 is not
  # expressible in this schema at all. Declaring `mode: none` states what
  # this connector actually does instead of encoding a lie about it; the
  # acceptance gate measures parse fidelity over a recorded page, which
  # pagination does not affect. A `step:` field on `Pagination` is the
  # upgrade path if crawling depth ever matters.
  #
  # `CADENA` is the board's own keyword search. Until 2026-09-10 this pointed
  # at the `atencion_al_cliente` category, so every candidate got the same
  # forty customer-service adverts whatever they had asked for — a pharmacy
  # technician's four phrases found nothing relevant on this board. Both halves
  # of the search are committed: `probe/` is the board's answer to `técnico
  # farmacia` (40 rows, 19 of them titled farm-/dermo-/cosm-), and
  # `tests/fixtures/connectors/trabajos_es_no_hits.html` is its answer to a
  # nonsense word — zero rows, not a fallback list, so an empty answer here
  # means empty. `tests/test_connect_portal.py` pins both. This pattern must
  # rebuild the probe's URL exactly. And each page echoes the term it searched
  # for in its own `CADENA` box, which this pattern must send back unchanged: a
  # key or a path the board ignores still carries `{query}`, but echoes nothing
  # (the category page `fixture/` came from echoes ""). The search page serves the
  # same `.listado2014.card.oferta` markup as the category page `fixture/` was
  # recorded from.
  url_pattern: "https://www.trabajos.com/ofertas-empleo/?CADENA={query}"
  pagination:
    mode: none
    max_pages: 1
  # One `.listado2014.card.oferta` per offer — forty on a full page. These are
  # the board's own semantic class names, not layout utilities, so they are a
  # better bet against a restyle than the grid classes around them.
  item: ".listado2014.card.oferta"
  fields:
    detail_url:
      css: "a.oferta.j4m_link"
      attr: href
    title:
      css: "a.oferta.j4m_link"
    company:
      css: "a.empresa"
    location_raw:
      css: "span.location"
    # The listing carries a truncated teaser ("…"). It is here so the connector
    # still produces a body if the detail page is unreachable; the detail page's
    # full text overrides it whenever both are present.
    text:
      css: "div.doextended"

    # The band, when the card states one as a band. `span.salario` holds it
    # alone — no label, no period, no other figure — so `take:` reads it
    # directly and there is nothing for `band_in_text` to do here (it wants a
    # pay cue, and `p.oi`, the only element that holds more than the figures,
    # reads "17.139 € - 17.140 €De duracion determinadaMedia Jornada": a
    # contract type and a working-hours label, neither of them a cue).
    #
    # Measured across this fixture's six cards that carry the span:
    #
    #   row  [9] "15.000 € - 25.000 €"   [29] "9 € - 13 €"            → read
    #   row  [3] "17.139 € - 17.140 €"   [8]  "18.000 € - 19.000 €"   → read
    #   row [17] "18.000 €"              [22] "22.000 €"              → refused
    #
    # **The middle pair is not lost, and the paragraph saying so was wrong.**
    # It said `text` maps `div.doextended`, that 12 of the 40 cards write
    # `div.do` instead, and that those rows therefore reach `build_offer` with
    # no body and are dropped — taking two published bands with them. The first
    # two clauses are true and the conclusion does not follow. `source()`
    # fetches an advert's own page exactly when the list row could not build an
    # offer by itself (`sourcing.py:1138`), so a bodiless card is not a dropped
    # card: it is a card that reads its body from the detail page, where
    # `div.subtitulo` supplies one. Rows [3] and [8] are two of those twelve,
    # and both keep their band — measured 2026-09-22 through `_offer_from` on
    # the route `source()` actually takes, which is how the error was found.
    # The claim came from a probe that parsed every row list-only and reported
    # a defect on the one kind of row that does not exist.
    #
    # Four of the six are therefore read, which is what T200's evidence counts.
    # What the twelve `div.do` rows do cost is a *fetch* each, and `text` is
    # still narrower than the card; that is a shape to improve, not a defect to
    # subtract from the salary number.
    #
    # The last two are a single figure, and `_take`'s exactly-two rule refuses
    # them by design: "One number is a single figure and not a band". Nothing
    # here overrides that, and the card is the reason it should not be
    # overridden — the same span carries "9 € - 13 €", which is an hourly rate,
    # and the board prints no period on any of them. A range at least says the
    # figures are the two ends of one thing; a lone "18.000 €" says only that
    # some number was published, and this connector will not decide what it is.
    #
    # `period` therefore stays absent on every row: the board states none, so
    # none is recorded. `bulk_filter` compares a floor only against a matching
    # period, so a periodless band is never silently measured against a yearly
    # floor; `presentation` prints the figures with no "/year" after them.
    salary_min:
      css: "span.salario"
      take: range_low
    salary_max:
      css: "span.salario"
      take: range_high
    salary_currency:
      css: "span.salario"
      take: currency

detail:
  fields:
    title:
      css: "h1"
    text:
      css: "div.subtitulo"
