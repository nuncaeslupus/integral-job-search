# No Fluff Jobs — the first connector in this library chosen for a *policy* of
# the board rather than for its stock: every posting carries a salary range,
# because the site refuses adverts without one. That is what a candidate who
# will not read an advert that hides its pay actually needs, and it is why this
# one is here even though it costs a field (see `detail_url` below).
#
# `robots.txt` was read live on 2026-08-30 with this project's own agent token.
# It carries `User-agent: *` groups only; neither `/Python` nor the `?page=`
# form is disallowed.
#
# KNOWN GAP — no per-advert link. The listing card *is* the `<a>`:
#
#     <a class="posting-list-item" href="/job/python-developer-regular-scalo…">
#       <aside class="tw-w-full"> …title, salary, company, city… </aside>
#     </a>
#
# `select_first` searches an item's *descendants*, so the item's own `href` is
# unreachable — `parse_list_page` hands each field selector the card node and
# the card node never matches itself. There is no inner anchor to fall back on
# (checked: the card's descendants are div/aside/h3/h4/span/svg and nothing
# else). So this connector reports what the board says about a job without
# saying where to read it, which is a real limitation and not an oversight;
# `connector_health`'s off-host-`detail_url` signal has nothing to check here.
# The fix belongs in the engine, not in a cleverer selector.
site: nofluffjobs
locale: en
version: "1.0.0"
last_verified: "2026-08-30"
# Listings are public; reading them needs no account.
auth: none

list:
  # `?page=2` returns pages one *and* two — the site renders its infinite
  # scroll cumulatively rather than as discrete pages. Duplicates across pages
  # are therefore expected and are the caller's to fold, which is cheap; the
  # alternative, one page only, throws away most of the board.
  url_pattern: "https://nofluffjobs.com/Python?page={page}"
  pagination:
    mode: query_param
    param: page
    start: 1
    max_pages: 3
  item: "a.posting-list-item"
  fields:
    title:
      css: "h3.posting-title__position"
    company:
      css: "h4.company-name"
    location_raw:
      css: "nfj-posting-item-city"
    # The card's own wrapper, which is the only body this board offers on a
    # listing page: title, salary range, tech tags, employer and city. It is a
    # summary and not an advert — but `Offer` refuses a blank body, and a
    # summary the board actually published beats a body invented to fill it.
    text:
      css: "aside.tw-w-full"

    # The band. **The note this replaces was wrong**, and the way it was wrong
    # is worth keeping: it said the board "prints the range as one string … and
    # nothing in this grammar can split it", so it declared no salary field at
    # all. That was true when it was written and false since T132 added the
    # `take:` vocabulary — and because it read as a settled refusal rather than
    # as a dated measurement, nobody re-ran it. A board whose entire reason for
    # being in this library is that every advert publishes a band was
    # contributing no bands.
    #
    # Measured against `fixture/list.html` on 2026-09-22, through
    # `<nfj-posting-item-salary>` (an Angular component element; the grammar's
    # tag selector addresses it like any other):
    #
    #   [0] "105 – 115 PLN / h"           -> min 105  max 115  PLN
    #   [2] "35 – 43 USD / h"             -> min 35   max 43   USD
    #   [1] "33 000 – 45 000 PLN / month" -> refused, and correctly
    #
    # The refusal is the design working, not a gap left to close. A space is
    # not a thousands separator in `_numbers_in`, so "33 000 – 45 000" reads as
    # *four* numbers (33, 0, 45, 0) and `_take`'s exactly-two rule answers
    # `None`. Teaching `_NUMBER` that a space separates thousands would merge an
    # unseparated pair — "105 115" — into 105115: the same 1000x error arriving
    # from the other side, and that one reaches a ranking wearing `stated=True`
    # instead of reaching it as nothing. `salary_currency` still resolves to PLN
    # on that row, which is what makes the refusal total: `build_offer`
    # constructs a `Salary` only when a number survived, so the row keeps its
    # band inside `text` and claims nothing.
    #
    # KNOWN CEILING — no period, and both readable rows are hourly. The grammar
    # has no `take` that cuts a period out of free text and `h` is not a word
    # `normalize_period`'s closed table accepts, so this connector cannot
    # declare `salary_period`. A band with no period is bounded as annual on
    # every route (`build_offer`, as `salary_recovery._band_defect` does for a
    # recovered one), and `105 – 115` / `35 – 43` fall outside it: these two
    # rows are REFUSED, with the reason written in `fixture/salary.json`, and
    # they read again the day a period `take` exists. They used to read with
    # `period=None`, which `bulk_filter._below_pay_floor` skips and
    # `presentation` prints with no unit — an hourly wage shown as a bare
    # number. The other hazard stands for whoever wires it: `pay_dominance`
    # compares on currency alone, so a periodless band that did get through
    # would rank an hourly PLN band against a monthly one.
    salary_min:
      css: "nfj-posting-item-salary"
      take: range_low
    salary_max:
      css: "nfj-posting-item-salary"
      take: range_high
    salary_currency:
      css: "nfj-posting-item-salary"
      take: currency
