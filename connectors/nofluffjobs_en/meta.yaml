# Who maintains this connector, where it points, and when it was last known to
# work. `connector.yaml` says what to fetch; this says whether anyone is still
# looking after it.
site: nofluffjobs.com
# Poland-registered and Poland-heavy, but the board carries remote EU postings
# and every one of them prints a range. `assess_coverage` matches country by
# equality, so this does not count as covering ES even when the advert is
# remote-from-anywhere — that is a known gap in the coverage model, not a claim
# being made here.
country: PL
language: en
maintainer: "@nuncaeslupus"
last_verified: "2026-08-30"

# Checked, not assumed, on the day above: https://nofluffjobs.com/robots.txt
# carries `User-agent: *` groups only — no rule names this project's token or
# any AI agent. Neither `/Python` nor its `?page=` form is disallowed.
policy:
  listings: public
  robots_txt: respected
  authentication: none

# Sampled for this purpose — the first three cards of the Python listing, taken
# on the date below. Never an advert a candidate was reading: the set of ads a
# person opens carries their field, level, city and the fact that they are
# looking, and a fixture in a public repository carries that forever.
fixture:
  provenance: sampled
  recorded: "2026-08-30"
  # Three cards out of twenty, cut from the served page. A fixture proves the
  # connector finds the right fields in real markup; it does not need the whole
  # listing to do that.
  bodies: excerpted
  client_ip: redacted
