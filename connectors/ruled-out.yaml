# ---------------------------------------------------------------------------
# NOT a property of any board — a limit of this engine. Several rulings above
# say "unusable" when the honest statement is "unusable *by a CSS-selector
# engine*". Recorded here so that closing the gap re-opens those entries instead
# of leaving them buried as settled refusals.
#
# **CLOSED on 2026-08-30.** `integral.connectors` gained a `from_json` block:
# an optional `embedded_in` selector naming the element whose text is the
# document (omit it and the response body *is* JSON), a `match` that picks the
# right document when a page serves several, `items` for the list page's array,
# and one dotted path per field. So the section stays — it is the record of what
# each ruling below was really about — but its premise is now historical, and
# every entry here is a connector somebody can write.
#
# What `from_json` still cannot express, and what would reopen this: an array
# index or a filter inside a path. The grammar is dotted keys plus the literal
# `$` for a document that is itself the array, and nothing else, so a board that
# keeps the field you want inside `hasPart[0].offers[2]` is still out of reach.
# That was a deliberate choice — the same "too small to smuggle anything
# through" discipline as the selector grammar — and not an oversight to fix
# without a board that needs it.
#
# The original statement, kept because the rulings below were made under it:
# the engine's whole vocabulary was a selector matched against markup
# (`integral.connectors.compile_selector`), with no way to say "parse this text
# node as JSON and take this key", so wherever a board kept its cleanest data in
# JSON the connector had to skip the field or scrape a messier HTML rendering of
# the same fact.
engine_gap_json:
  named: "a declared JSON pointer per field, alongside `css`, in integral.connectors"
  found: 2026-08-30
  closed: 2026-08-30
  closed_by: "the `from_json` block — see integral.connectors.JsonSource"

  # Two independent routes to the same missing feature, found the same day by
  # different readers — which is why it is worth recording rather than filing as
  # one board's quirk.
  evidence:
    - route: "JSON-LD embedded in a page the connector ALREADY fetches"
      example: tecnoempleo.com
      detail: >
        The detail page carries a schema.org JobPosting with
        baseSalary {currency: EUR, minValue: 30000, maxValue: 36000, unitText: YEAR}
        — exactly the four fields `build_offer` wants, already typed. Unreachable:
        it is JSON inside ONE text node in a <script>, so a selector returns a 2 KB
        blob. The connector scrapes the HTML instead and ends up unable to map
        salary at all (the visible rendering is one unsplittable string).
      cost: "this is the cheap one — no extra request, the bytes are already in hand"

    - route: "a framework data endpoint serving what the HTML withholds"
      example: getmanfred.com
      detail: >
        /_next/data/<BUILD_ID>/es/job-offers/<id>/<slug>.json returns 200 to a
        plain request (no cookies, tool UA) with offer.title, offer.company,
        offer.salaryMin, offer.salaryMax, offer.currency, offer.remote,
        offer.locationsSummary and offer.status — the whole record, structured.
      but: >
        This does NOT on its own re-open getmanfred. The *listing* endpoint
        (/_next/data/<BUILD_ID>/es/job-offers.json) returns only filter
        vocabularies — currencies, techs, techRoles — the same payload as
        __NEXT_DATA__. The offer list arrives by some other call. No list surface,
        no connector, JSON support or not.
      also: >
        <BUILD_ID> changes on every deploy. A connector hard-coding one breaks at
        the next release, so this route needs a discovery step too — a second
        thing the schema cannot currently express.

  # Measured over the fixtures already committed here, so the payoff is a
  # number rather than an argument.
  measured_today:
    fixtures_carrying_jsonld_jobposting: 3
    of_packages_with_a_detail_fixture: 3
    per_package:
      remotive_en: "JobPosting present; baseSalary has currency USD and unitText YEAR but no min/max"
      trabajos_es: "JobPosting present; no baseSalary at all"
      weworkremotely_en: "JobPosting present; baseSalary minValue '0', maxValue '0'"

  # The part that stops this being a free win, and the reason to name it here
  # rather than in a hopeful ticket.
  caveat: >
    Structured does not mean true. weworkremotely's JSON-LD states
    minValue '0' / maxValue '0' — the SAME sentinel-zero trap a sibling caught in
    ticjob's HTML today, where mapping it would have published "the employer
    stated €0" across most of the board. Both are strings, not numbers, so a
    naive JSON reader would coerce and publish them. Any JSON path must carry the
    same defence the selector path needed: a zero, an empty string and a missing
    key are all "not stated", and `Salary(stated=True)` with no numbers is worse
    than no salary at all, because the ranking uses it.

  reopens_if_closed:
    - "the salary field on tecnoempleo_es, infojobs_es, ticjob_es, builtin_en, jobsacuk_en and wellfound_en — all six left salary unmapped for want of a split, and several have clean JSON-LD sitting in the same page"
    - "workingnomads.com — ruled out as a shell, but serves /api/exposed_jobs/ (REOPENED 2026-08-30; connector waits on feat/json-connector-packages for its probe)"
    - "usajobs.gov — see above; its API is public and its listing is not in HTML"

  # Boards ruled out *only* by this gap — closing it makes each a connector.
  boards:
    - site: justjoin.it
      checked: 2026-08-30
      why_it_was_tried: "salary range is mandatory on every posting — the board's own rule, not a courtesy"
      evidence: >
        1.9 MB served, and the postings really are in it — but as JSON-LD, not as
        markup. Anchors matching href="/job-offer/ count 0; the same URLs appear
        130+ times inside a ld+json array of
        {"url":"https://justjoin.it/job-offer/…","@type":"CreativeWork"} entries.
        The visible list is client-rendered from that. A CSS-selector engine can
        reach the <script> node but not the structure inside it, so this is
        "unusable by this engine", not "unusable".
      reopened: 2026-08-30
      reopened_by: >
        the `from_json` block. justjoin.it is now a two-block connector:
        `CollectionPage.hasPart` on the listing gives the URLs, and each advert's
        own `JobPosting` gives title, employer, description and a salary whose
        `minValue`/`maxValue` are numbers. The package waits on
        `feat/json-connector-packages` until it can carry a probe — a probe is
        the *second* capture of the same query, taken on a later day, so the
        earliest honest one is the day after the connector was written.
      robots: "Allow: /job-offers/ and /job-offer/ both permitted, checked live with this project's own token."
      retest: "curl -sL --compressed -A \"integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)\" 'https://justjoin.it/job-offers/all-locations/python' | grep -c 'href=\"/job-offer/'  # prints 0 today; anything above 0 reopens this"

# ---------------------------------------------------------------------------
# Ruled out because their robots.txt itself could not be read. An unanswered
# question about policy is not a yes — `Robots._groups_for` raises rather than
# defaulting to permissive, and that refusal is deliberate. These are the
# cheapest to retry: one request each.
# ---------------------------------------------------------------------------
# Not refused, not JavaScript — simply not there any more. One line each, so the
# next reader spends a request confirming rather than an afternoon guessing.
moved_or_gone:
  - site: otta.com
    checked: 2026-08-30
    detail: >
      /jobs returns 404. Otta was absorbed into Welcome to the Jungle, whose app
      (app.welcometothejungle.com/jobs) is client-rendered — 44 KB, zero job
      anchors, no JobPosting — and whose search path this project's agent is
      disallowed from anyway. Both halves are dead ends; robots.txt closes one
      and rendering closes the other.
    retest: "curl -sIL -A \"integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)\" https://otta.com/jobs | head -1  # 404 today"

# Ruled out by OUR policy, not by the board's robots.txt. Everything here is
# mechanically ALLOWED — the matcher says True and a second parser agrees — and
# is not fetched anyway. Kept apart from `robots_refused` on purpose: collapsing
# the two would let a judgement call be read later as a measurement, which is
# the one thing this file exists to prevent.
#
# The rule being applied is named in the header as
# `restated_for_every_named_agent`. Each entry must show the matcher's True, a
# second parser agreeing, and the text the operator wrote — so the judgement can
# be overturned by argument rather than only by re-doing the work.
#
# And each entry must say **whose call it was, when, and whether it refuses
# volume or access** (T99, `integral.connector_policy`). The first entry here
# had none of that: it was written by the implementing session on its own
# reading of the operator's intent, and read a week later exactly like a
# settled position. Throttling a connector and deleting a board from a
# candidate's reach are different refusals, and a section that does not say
# which cannot be argued with.
policy_refused:
  - site: remoteok.com
    checked: 2026-08-31
    refuses: volume
    robots_verdict: allowed
    decided_by: owner
    decided_on: 2026-08-31
    decision: >
      "It is the user who will use the scraper, not you, and most of them did
      not allow massive scraping for AI, but they allow it for making some
      searches. You should be able to build a scraper for this use without any
      problem."

      The owner's call, stated in session on 2026-08-31 and applied here on
      2026-09-01. It turns on *who is fetching*: a tool the candidate runs to
      look at a handful of adverts is not an AI crawler ingesting a board, even
      where one user agent covers both. The eleven restated Disallow lines are
      read as what they say they are — a refusal of bulk AI ingestion — so this
      entry refuses **volume** and not **access**. It was previously an access
      refusal written on the implementing session's own judgement and never put
      to the owner; that is the defect T99 records, and it would have been the
      defect whichever way this resolved.

      This narrows the ledger entry. It does not build a connector, and it is
      not a finding that remoteok should be read — the shell/AJAX mechanism in
      `detail` below is unchanged and still the reason nobody has.
    was_in: "corrected, for about six hours on 2026-08-31, before test 1 was re-run against the endpoint the capture found"
    verdict: >
      Allowed by robots and refused for volume, not access. This is OUR policy,
      applied under the `restated_for_every_named_agent` rule in the header;
      robots.txt does not refuse it and this entry does not claim it does.
    rule_cited: >
      `Disallow: /*?action=get_jobs` and `Disallow: /?tags`, under the heading
      `# AJAX endpoints`, and restated verbatim in the file's AI/LLM group.
    detail: >
      The capture was right about the mechanism and the correction drawn from it
      was wrong. remoteok.com serves a shell: `/remote-dev-jobs` is 59,681 bytes
      with zero `<tr data-slug>` rows, and the 50 rows of ordinary markup arrive
      only from `/?tags=dev&action=get_jobs&premium=0&offset=`. That endpoint is
      the subject of the two Disallow lines above, so the board's only advert
      surface is the one path it asks crawlers not to take.

      **The repo matcher returns True for it, and that is not a defect.** Nor is
      it a loophole to use. Read the file and the reason is plain: those Disallow
      lines sit after `User-agent: AhrefsBot / Disallow: /`, so under RFC 9309 a
      group ends at the next user-agent line and they belong to AhrefsBot rather
      than to `*`. Python's stdlib `urllib.robotparser` agrees with our matcher
      on all three URLs, which is the negative control this file asks for: two
      independent parsers, same verdict, so the True is the file's meaning and
      not our bug. The operator's *intent* is unmistakable all the same — they
      captioned the block `# AJAX endpoints`, and the file's own AI/LLM section
      restates `Disallow: /*?action=get_jobs` and `Disallow: /?tags` verbatim
      for GPTBot, ClaudeBot, anthropic-ai, Claude-Web, PerplexityBot and six
      others. A board that writes the same refusal twice has said it twice.

      Reading a site's only content surface through a stray blank line, against
      a restriction restated for every AI agent the operator could name, is not
      a permission this ledger will record as one. The mechanism is written down
      so the next reader can disagree with the judgement rather than have to
      re-derive the facts — and so that a later fix to remoteok's robots.txt,
      in either direction, is visibly the thing that changes the answer.
    also: >
      Independently disqualifying even if the robots question went the other
      way: the ld+json in those rows is fabricated. 48 of the 50 JobPosting
      blocks carry the identical band `USD 80000-150000 YEAR`, including a Vertu
      Motors vehicle progressor in Dunfermline whose own description states a
      basic salary of GBP 28,000. RemoteOK stamps a house estimate into
      schema.org `baseSalary` for every advert that does not state one, and does
      not mark it as an estimate. See the `salary` note in `engine_gap_json` —
      a connector reading `baseSalary` without checking the spread across rows
      would have published 48 invented bands.
    retest: >
      curl -s -A "integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)"
      https://remoteok.com/robots.txt | grep -n 'action=get_jobs'   # 3 lines today, one of them in the AI/LLM group


