javascript_rendered:
  # getmanfred.com, remoteok.com and usajobs.gov were here until 2026-08-31.
  # All three are in `corrected` now. Their served HTML is exactly as empty as
  # this section said — the entries were not sloppy — and all three fetch their
  # adverts from an endpoint a plain curl reaches under this tool's own product
  # token. THREE OF SIX. Reading "the advert is not in these bytes" as "this
  # board cannot be read" was the whole error, and it was made six times in one
  # sitting.
  #
  # What remains is NOT thereby confirmed. Each entry carries `capture_read`,
  # which says whether test 3 has actually been run against it and what came
  # back. Two of the three below have not been read to a conclusion, and an
  # unread capture is precisely the state getmanfred was in yesterday.

  - site: idealist.org
    checked: 2026-08-30
    capture_read: >
      2026-08-31 — read, and the ruling stands. The rows come from a POST to
      nsv3auess7-dsn.algolia.net (191 KB of JSON), so this board fails the same
      GET-only limit as usajobs did AND carries an application id plus a search
      key in the query string. A connector may not carry a credential, and a
      key lifted from someone else's capture is a credential whoever minted it
