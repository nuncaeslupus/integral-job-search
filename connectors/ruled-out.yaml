    connector: >
      `connectors/usajobs_en/`, added by T89 and the library's first POST
      package. Both surfaces were re-captured on 2026-09-02 with this tool's
      own product token: the list POST (200, 35,067 bytes, 25 rows, `Total: 44`,
      `Pager.NumberOfPages: 2` — the committed *fixture*; the *probe* is a
      second read an hour later and reads `Total: 43`, which `meta.yaml`
      records and is the point of keeping both) and one announcement,
      https://www.usajobs.gov/job/856726500 (200, 126,012 bytes,
      server-rendered — test 2 passes in the served bytes, so no headless
      browser). Robots re-adjudicated the same day with two parsers agreeing
      AND a negative control: /Search/ExecuteSearch and /job/… True, /Content/
      and /Scripts/ False.

      `MinimumRange` is mapped as `salary_min` only after running test 4 over
      all 25 rows: 14 distinct minimums and 18 distinct
      (MinimumRange, SalaryDisplay) pairs, $50,460 to $169,279, no zeros. That
      is the employer's own figure, not remoteok's one invented band on 48 of
      50 adverts. No `salary_max`: every row reads "Starting at $X", which is a
      floor, and synthesising the other end would be inventing the employer's
      words.
    still_open: >
      the second page, and no longer a key nobody measured. T113 removed `Page`
      from the shipped body and set `pagination.mode: none`: only page 1 was
      ever captured, its request body carried NO page key at all, and `Page` —
      the name the board's own `Pager` implies through
      `CurrentPageIndex`/`NextPageIndex` — was read out of the RESPONSE, which
      shows the board reports a page index rather than accepting one under that
      spelling. The old defence ("inert at `max_pages: 1`, because an unbound
      key is ignored and a bound one returns page 1 anyway") is what T113
      refuses: it holds only while nobody raises the number, and if the board
      ignores the key then page 2 duplicates page 1 and the fetcher collects
      duplicate offers with nothing to report it. `probe/captured.json` now
      records the request it was taken with — `method: POST` and the body
      `{"Keyword":"python","ResultsPerPage":25}`, the same body the `retest`
