    retest: "curl -sL --compressed -A \"integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)\" https://landing.jobs/jobs/for/python | grep -cE 'href=\"/jobs/[0-9]+'  # prints 0 today; anything above 0 reopens this"

