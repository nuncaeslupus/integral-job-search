# Boards that were surveyed and did NOT get a connector — and why.
#
# This file exists because the reasons kept getting lost, and lost reasons are
# expensive twice over: once when somebody re-surveys a board that is already
# known to be a shell, and once when somebody trusts a stale ruling and skips a
# board that has since become readable. Both happened here. The header comment
# in `connectors/trabajos_es/connector.yaml` ruled out six boards in one
# paragraph; **two of those entries were wrong**, and one was wrong twice over
# (see `corrected` below). A prose aside in one connector's header is not a
# record — nothing points at it, nothing dates it, and nothing says how to check
# whether it still holds.
#
# So: one entry per board, each carrying the date it was checked, the evidence,
# and — the part that actually matters — a `retest` command whose output today
# is stated, so a future reader can run one line and know whether anything
# changed. A ruling without a retest is a guess with a date on it.
#
# `connector_packages()` and `connector_coverage` both filter on `is_dir()`, so
# nothing in the sourcing path reads this file; it is for the next person (or
# the next Claude) deciding where to spend an hour. **One gate does read it**:
# `integral.connector_policy` (T99) parses `policy_refused` and asserts every
# entry there records whose call it was. Nothing else parses any other section,
# and this line is the only place that says so — the header used to read
# "nothing reads this file", which is how the section below came to contradict
# the rule stated twenty lines down without anything noticing.

# ---------------------------------------------------------------------------
# The two tests that decide it, so an entry below can be read as shorthand.
#
# 1. ROBOTS. Adjudicate with the repo's own audited matcher (T70), never a grep:
#
#      uv run python3 -c "
#      from integral.robots import Robots, USER_AGENT
#      r = Robots(); print(USER_AGENT); print(r.allows('<url>'))"
#
#    `USER_AGENT` is `integral-job-search/0.1`. Under RFC 9309 a crawler matches
#    the group for its own product token and falls back to `User-agent: *`, so a
#    `ClaudeBot`/`GPTBot`/`CCBot` group **does not bind this tool**. Those bans
#    target bulk training crawls; a connector is one candidate's search. Some
#    boards spell the distinction out — academictransfer.com's robots.txt says
#    "AI assistants may access pages for search/reference answers" while
#    disallowing `ClaudeBot`. Only a `*`-group disallow rules a board out.
#    Always run a NEGATIVE CONTROL: show some path returning False, or a True
#    answer is indistinguishable from a matcher that says yes to everything.
#
#    **And the control must come from the SECOND reader, not from the two
#    agreeing.** stdlib `urllib.robotparser` returns the FIRST matching rule in
#    file order, not RFC 9309 §2.2.2's longest match, so on any robots.txt
#    opening with `Allow: /` it answers True for every path in the file and
#    cannot refuse at all. Two matchers agreeing means something only when both
#    can disagree. `connectors/robots-adjudications.yaml` records, per board,
#    whether the second reader was shown refusing one path on that same file —
#    and where it could not, the adjudication is recorded as single-parser
#    rather than counted as an agreement (T116,
#    `integral.connector_policy --second-readers`). A file that disallows
#    nothing at all, like www.workingnomads.com's bare `Disallow:`, gets its own
#    verdict there, because "no control is possible" and "no control was run"
#    were previously the same silence.
#
#    `restated_for_every_named_agent` — the one case where a True is not
#    enough. A path the `*` group does not reach, but which the SAME file
#    disallows for every named AI agent it lists, is not fetched, and the board
#    goes to `policy_refused` rather than to `robots_refused`.
#
#    This does not contradict the paragraph above it; the two are about
#    different things. "A ClaudeBot group does not bind this tool" answers a
#    BLANKET ban on a whole site, aimed at bulk training crawls. This answers a
#    SPECIFIC path the operator closed to everyone they could think of, usually
#    with a plain-language caption saying what it is. remoteok.com captioned it
#    `# AJAX endpoints`, then listed the same two Disallows again for eleven
#    named agents. Taking that path because our product token is not on the list
#    is reading a permission out of an omission.
#
#    The bar is high on purpose, so this stays a rule and not a mood: the same
#    path, disallowed in the same file, for EVERY named agent — not one, not a
#    Claude-shaped subset. One board meets it today. Anything ruled out this way
#    records the matcher's True, a second parser agreeing, and the operator's
#    own words, so the judgement can be overturned by argument.
#
# 2. SERVER-RENDERED OR NOT. Counting hrefs is unreliable — a wrong URL pattern
#    looks exactly like an empty page (it fooled the first survey on infojobs,
#    tecnoempleo and usajobs alike). The reliable test is: **take a real advert
#    title from the site's own sitemap and search for it in the served bytes.**
#    Absent means client-injected. Framework markers (`id="__next"`, `ng-app`)
#    prove nothing on their own: wellfound.com carries `id="__next"` and is
#    server-rendered anyway.
#
# 3. WHAT DID THE PAGE FETCH? Test 2 answers "is the advert in these bytes",
#    which is not the same question as "can this board be read". A client-side
#    board got its rows from *somewhere*, and that somewhere is usually a plain
#    request this tool can make too. Test 2 cannot see it, because it reads one
#    response and the answer is in the next one.
#
#    Record a browser capture and search it for the advert instead:
#
#      uv run --with playwright python3 tools/capture_har.py <url> tmp/<site>.har
#      python3 .claude/skills/har/scripts/query_har.py --input tmp/<site>.har \
#          --response-match "<a real advert title>"
#
#    Three of the six boards filed under `javascript_rendered` fell to this the
#    first time it was run — getmanfred.com, remoteok.com and usajobs.gov. Each
#    then answered a plain `curl` under this tool's own product token, so the
#    browser was needed to *find* the endpoint and not to use it. A board is not
#    ruled out on rendering until its capture has been read.
#
#    **Then run test 1 again, against the endpoint the capture just revealed.**
#    This step was written into the file a day after the rest of it, because
#    skipping it is what produced the only wrong entry this ledger has yet
#    carried. A capture reveals a URL nobody had looked at before, and robots
#    speaks about *paths* — so the permission established for the listing page
#    says nothing about the XHR behind it. remoteok.com was moved to `corrected`
#    on the strength of `/?tags=dev&action=get_jobs`, and that path is the
#    subject of a `Disallow` line in the board's own robots.txt under the
#    heading `# AJAX endpoints`. Two of the three corrections survived the
#    follow-up; remoteok.com is now in `policy_refused` — allowed by robots,
#    refused by us — and its entry records what the shortcut cost.
#
#    The order is not decorative. Test 1 before the capture asks "may I read
#    this page"; test 1 after it asks "may I read the thing the page reads",
#    and only the second question is about the URL a connector would fetch.
#
# 4. IS THE STRUCTURED DATA TELLING THE TRUTH? Tests 1-3 establish that a field
#    can be READ. None of them asks whether its value is a fact. A schema.org
#    `baseSalary` is the most inviting field on the web — typed, four-part,
#    exactly the shape `build_offer` wants — and it is also the one boards are
#    most willing to fill in on the employer's behalf.
#
#    The test is one line, and it is a SPREAD, not a spot check:
#
#      <parse the list> | count how many distinct (min, max, currency) triples
#
#    remoteok.com: 48 of 50 adverts carried the identical `USD 80000-150000
#    YEAR`, one of them a car dealership in Dunfermline whose own description
#    states GBP 28,000. Nothing marks it as an estimate. A spot check on any
#    single advert passes; the spread is what exposes it.
#
#    Two shapes to know:
#      * A HOUSE ESTIMATE, as above — a plausible band stamped onto every ad
#        that did not state one. Never map it. Prefer a figure the employer
#        supplied, or none.
#      * A SENTINEL, where the field is present and means absent. getmanfred's
#        list API sends `salaryFrom: 0` on 9 of 21 offers; zero is not a wage.
#        A present-but-zero figure must not become `Salary(stated=True, min=0)`.
#
#    Both fail the same way, and it is the worst way available here: the offer
#    ranks, the gate is green, and the number is fiction. A connector that maps
#    no salary is merely less useful. One that maps an invented salary is
#    actively wrong about the thing the candidate is optimising for.
# ---------------------------------------------------------------------------

surveyed: 2026-08-30
surveyed_by: "@nuncaeslupus"

