    retest: "curl -sIL -A \"integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)\" https://otta.com/jobs | head -1  # 404 today"

# Ruled out by OUR policy, not by the board's robots.txt. Everything here is
# mechanically ALLOWED — the matcher says True and a second parser agrees — and
# is not fetched anyway. Kept apart from `robots_refused` on purpose: collapsing
# the two would let a judgement call be read later as a measurement, which is
# the one thing this file exists to prevent.
#
# The rule being applied is named in the header as
# `restated_for_every_named_agent`. Each entry must show the matcher's True, a
# second parser agreeing, and the text the operator wrote — so the judgement can
# be overturned by argument rather than only by re-doing the work.
#
# And each entry must say **whose call it was, when, and whether it refuses
# volume or access** (T99, `integral.connector_policy`). The first entry here
# had none of that: it was written by the implementing session on its own
# reading of the operator's intent, and read a week later exactly like a
# settled position. Throttling a connector and deleting a board from a
# candidate's reach are different refusals, and a section that does not say
# which cannot be argued with.
policy_refused:
  - site: remoteok.com
    checked: 2026-08-31
    refuses: volume
    robots_verdict: allowed
    decided_by: owner
    decided_on: 2026-08-31
    decision: >
      "It is the user who will use the scraper, not you, and most of them did
      not allow massive scraping for AI, but they allow it for making some
      searches. You should be able to build a scraper for this use without any
      problem."

      The owner's call, stated in session on 2026-08-31 and applied here on
      2026-09-01. It turns on *who is fetching*: a tool the candidate runs to
      look at a handful of adverts is not an AI crawler ingesting a board, even
      where one user agent covers both. The eleven restated Disallow lines are
      read as what they say they are — a refusal of bulk AI ingestion — so this
      entry refuses **volume** and not **access**. It was previously an access
      refusal written on the implementing session's own judgement and never put
      to the owner; that is the defect T99 records, and it would have been the
      defect whichever way this resolved.

      This narrows the ledger entry. It does not build a connector, and it is
      not a finding that remoteok should be read — the shell/AJAX mechanism in
      `detail` below is unchanged and still the reason nobody has.
    was_in: "corrected, for about six hours on 2026-08-31, before test 1 was re-run against the endpoint the capture found"
    verdict: >
      Allowed by robots and refused for volume, not access. This is OUR policy,
      applied under the `restated_for_every_named_agent` rule in the header;
      robots.txt does not refuse it and this entry does not claim it does.
    rule_cited: >
      `Disallow: /*?action=get_jobs` and `Disallow: /?tags`, under the heading
      `# AJAX endpoints`, and restated verbatim in the file's AI/LLM group.
    detail: >
      The capture was right about the mechanism and the correction drawn from it
      was wrong. remoteok.com serves a shell: `/remote-dev-jobs` is 59,681 bytes
      with zero `<tr data-slug>` rows, and the 50 rows of ordinary markup arrive
      only from `/?tags=dev&action=get_jobs&premium=0&offset=`. That endpoint is
      the subject of the two Disallow lines above, so the board's only advert
      surface is the one path it asks crawlers not to take.

      **The repo matcher returns True for it, and that is not a defect.** Nor is
      it a loophole to use. Read the file and the reason is plain: those Disallow
      lines sit after `User-agent: AhrefsBot / Disallow: /`, so under RFC 9309 a
      group ends at the next user-agent line and they belong to AhrefsBot rather
      than to `*`. Python's stdlib `urllib.robotparser` agrees with our matcher
      on all three URLs — **but that is an agreement, not the negative control
      this file asks for**, which T116 corrected in
      `connectors/robots-adjudications.yaml`. Three agreeing Trues do not show
      the second reader able to say no, and a reader that cannot say no cannot
      disagree, so its agreement adds nothing. This adjudication is recorded
      there as `single_parser`. The verdict is unchanged and does not depend on
      it: remoteok is refused on policy, not on robots, and the repo matcher —
      the audited one — is what carried the True. The operator's *intent* is unmistakable all the same — they
      captioned the block `# AJAX endpoints`, and the file's own AI/LLM section
      restates `Disallow: /*?action=get_jobs` and `Disallow: /?tags` verbatim
      for GPTBot, ClaudeBot, anthropic-ai, Claude-Web, PerplexityBot and six
      others. A board that writes the same refusal twice has said it twice.

      Reading a site's only content surface through a stray blank line, against
      a restriction restated for every AI agent the operator could name, is not
      a permission this ledger will record as one. The mechanism is written down
      so the next reader can disagree with the judgement rather than have to
      re-derive the facts — and so that a later fix to remoteok's robots.txt,
      in either direction, is visibly the thing that changes the answer.
    also: >
      Independently disqualifying even if the robots question went the other
      way: the ld+json in those rows is fabricated. 48 of the 50 JobPosting
      blocks carry the identical band `USD 80000-150000 YEAR`, including a Vertu
      Motors vehicle progressor in Dunfermline whose own description states a
      basic salary of GBP 28,000. RemoteOK stamps a house estimate into
      schema.org `baseSalary` for every advert that does not state one, and does
      not mark it as an estimate. See the `salary` note in `engine_gap_json` —
      a connector reading `baseSalary` without checking the spread across rows
      would have published 48 invented bands.
    retest: >
      curl -s -A "integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)"
      https://remoteok.com/robots.txt | grep -n 'action=get_jobs'   # 3 lines today, one of them in the AI/LLM group


