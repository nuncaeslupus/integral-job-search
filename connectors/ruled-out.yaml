  - site: landing.jobs
    checked: 2026-08-30
    rechecked: 2026-08-30
    why_it_keeps_being_tried: "publishes gross annual bands, Iberian, remote across the EU — the exact profile a salary-transparency filter wants, so it will be proposed again unless this entry is read"
    evidence: "carries data-react and ng-app; every href is a marketing or category page, zero per-offer links"
    evidence_2026_08_30: >
