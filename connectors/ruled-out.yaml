      element appears, this is a connector waiting to be written — DE has none.
  # The next two were surveyed on 2026-09-10 for a pharmacy technician in
  # Barcelona, whose four phrases found nothing on the six ES boards then
  # installed: those boards are tech-heavy, so the gap was SECTOR, not
  # language. Both boards would close it; both need the engine first.
  - site: farmatalent.com
    country: ES
    language: es
    checked: "2026-09-10"
    robots: >
      allowed — /vacantes/1/todas/todas/todas/sin and /ver-vacante/2600 True;
      /archivos-modificados/cv.pdf and /blog/feed/ False (negative controls),
      and integral.second_reader agrees on all four. The file also carries
      `Disallow /_seo/` with no colon, which both parsers ignore.
    readable: >
      Yes. A pharmacy-office recruiter: every advert is a pharmacist or
      pharmacy technician post, ~12 per page, server-rendered, with province
      (`/vacantes/{page}/barcelona/…`) and qualification
      (`…/auxiliar/…`) filters in the path. The advert page carries the body in
      `div.div-ver-vacante` and a JobPosting ld+json. No keyword search, so it
      would be unsteered.
    gap: >
      Each card is `<a href='…/ver-vacante/N' title="…">` wrapping
      `div.vacante-div-wrapper`, and the href is on the item ITSELF. Field
      selectors read only an item's descendants (`_extract` → `select_first`),
      so with the `a` as the item no field can reach its href, and with the
      wrapper as the item the href is on an ancestor. No other element in the
      card carries the advert's URL.
    also: >
      Unsteered AND sector-specific is a new combination: every ES candidate
      would get ~12 pharmacy adverts per run. Worth deciding before writing it.
    blocked_on: "an engine change — a field that may read the item's own attribute"
    retest: >
      curl -s -A integral-job-search https://www.farmatalent.com/vacantes |
      grep -c "href='https://www.farmatalent.com/ver-vacante/"  # 12 today, each on a bare <a>
  - site: infoempleo.com
    country: ES
    language: es
    checked: "2026-09-10"
    robots: >
      allowed — /trabajo/?search=farmacia True. The file disallows
      `/trabajo/palabra_` (the old keyword pages), but the board's own search
      form and its schema.org SearchAction both publish
      `/trabajo/?search={search_term_string}`, so this is the operator's own
      search URL rather than a way round that line.
    readable: >
      Yes, and steerable — a general board across every sector.
      `?search=python` returns developer roles and `?search=parafarmacia`
      cosmetics and pharmacy-sales roles. Items are `li.offerblock`, title and
      href in `h2.title a`, company in `div.logoplusname span.extra-data`,
      teaser in `p.trunkat`. Note that the reCAPTCHA on the page belongs to the
      job-alert form. It is not a challenge.
    gap: >
      A query with no hits does not return an empty page. It prints
      `div.noresults` ("No encontramos ofertas para esta búsqueda") and then
      ten unrelated adverts in `ul.positions.ShortResult`, while real results
      sit in `ul.positions`. The rows are the same `li.offerblock` in both,
      and a simple selector cannot say "not inside .ShortResult". So a miss
      would be recorded as ten offers found by searching the candidate's
      phrase. That is fail-open, and the fetch log would state it as fact.
      Measured: `zzqxvw` and `farmacia online atención al cliente` both return
      the same ten fallback adverts (a forklift driver, two mechanics, …).
    blocked_on: "an engine change — a listing may declare a no-results marker that empties the page"
    retest: >
      curl -s -A integral-job-search 'https://www.infoempleo.com/trabajo/?search=zzqxvw' |
      grep -c 'class="noresults"'  # 1 today; 0 with no fallback list would unblock it

engine_gap_offer_url:
  # A board whose advert body can only be read from an API, while the URL a
  # candidate should open is a different, human page. `build_offer` takes
  # `url=url or merged.get("url")`, and sourcing passes the DETAIL FETCH URL
  # as `url`, so a mapped `url` field always loses to it.
  - site: pmfarma.com
    country: ES
    language: es
    checked: "2026-09-10"
    robots: >
      www.pmfarma.com allows /app/empleo. The listing is a Quasar app shell
      (1,197 bytes), and a capture (test 3) shows the rows come from
      https://api.pmfarma.com/api/ofertas?pais=28. That host's robots.txt is
      `User-agent: *` / `Disallow:`, which refuses nothing, so no negative
      control is possible on it. A plain GET under the tool's UA answers 200.
      The request the app sends carries `authorization: null` and only Google
      Analytics cookies, so there is no credential.
    readable: >
      Yes. JSON, 10 per page, 157 ES offers (47 in Barcelona), mostly pharma
      industry roles — "Visita Médica / Farmacias" is 111 of them, and it
      includes dermoconsejera posts. The list carries `nombre`,
      `empresa.nombre`, `estados_text`, `pais.iso` and `link` (the human page).
      The body (`descripcio`) is only in `/api/oferta/{id}`, a one-element
      JSON list, and `/empleo/{id}-slug.html` redirects to the app shell. There
      is no text-search parameter (pais, estados, cargos, modalidades only),
      so it would be unsteered.
    gap: >
      The detail must be fetched from api.pmfarma.com/api/oferta/{id}, and
      that fetch URL would become `Offer.url`. The candidate would be shown a
      JSON endpoint instead of the advert, and step 11 would apply to it.
    blocked_on: "an engine change — a mapped `url` field should outrank the detail fetch URL"
    retest: >
      curl -s -A integral-job-search 'https://api.pmfarma.com/api/ofertas?pais=28' |
      python3 -c "import json,sys; d=json.load(sys.stdin); f=d['filtros'];
      print(d['meta']['total'], [e['total'] for e in f['estados'] if e['slug']=='barcelona'],
      [c['total'] for c in f['cargos'] if c['id']==30])";
      curl -sL -A integral-job-search https://www.pmfarma.com/empleo/ | wc -c
      # prints 157 [47] [111] and then 1197, the size of the app shell, on 2026-09-10

engine_gap_charset:
  # The connector schema has nowhere to declare a board's character set, and
  # every capture in this repo is read as UTF-8. Eighteen packages hide that,
  # because all eighteen are UTF-8. It is not a coincidence that the first
  # board to break it is Portuguese: legacy encodings survive longest on the
  # non-English European boards, which is exactly where the coverage gap is.
  - site: net-empregos.com
    country: PT
    language: pt
    checked: "2026-09-06"
    robots: "allowed — /pesquisa-empregos.asp and the detail paths are all True"
    readable: >
      Yes, and cleanly. `div.job-item` per result, `a.oferta-link` carries both
      the bare title text and the href, `img.net-img-logo[alt]` is the company,
      and the detail page's `div.job-description` is the advert body. 59,791
      live adverts, `?page=N` paginates and was verified to return different
      results on page 2.
    gap: >
      The board serves **ISO-8859-1** (`<meta charset="ISO-8859-1">`, no charset
      in the Content-Type header) and `bytes.decode("utf-8")` raises
      UnicodeDecodeError on it outright. Decoding with `errors="replace"` gives
      `T\ufffdcnico de Manuten\ufffd\ufffdo` — mojibake in every accented
      Portuguese word, which is most of them. `connector.yaml` has no `charset`
      key and `Fetch` is injected, so there is no layer that could be told.
    also: >
      `?nome_pesquisa=python` is IGNORED — 59,791 results either way and an
      identical first row, so this board takes no `{query}` and would join
      trabajos_es as an unsteered one. Worth knowing before writing it.
    blocked_on: "an engine change, not a board change"
    retest: >
      python3 -c "import urllib.request as u; print(u.urlopen(u.Request(
      'https://www.net-empregos.com/pesquisa-empregos.asp',
      headers={'User-Agent':'integral-job-search'})).read()[:2000])" | grep -o 'charset=[^\"]*'

language_unsupported:
  # Not a property of these boards. `Language = Literal["en", "es", "ca"]`, so
  # `load_connector` refuses any package declaring another locale — which is
  # every board in the five countries with zero coverage. Recorded here so the
  # next reader does not survey a board, clear its robots, map its fields and
  # then discover this, which is what happened on 2026-09-06. See #358.
  - locales: [pt, de, fr, it, nl]
    checked: "2026-09-06"
    detail: >
      Measured cost of adding one: cue vocabularies across 41 dimension files
      (en 31, es 38, ca 31 entries today), 24 strings in
      `strings/catalogue.json`, and corpus adverts in that language — currently
      ca 90, es 93, en 25 and zero for all five. Adding a locale to the literal
      without the rest would leave up to 41 new empty slices in
      `T3.language_slices_with_no_corpus_hit`, and the owner's standing rule is
      that supported languages behave identically.
    retest: >
      uv run python -c "from integral.dimensions import Language;
      import typing; print(typing.get_args(Language))"

