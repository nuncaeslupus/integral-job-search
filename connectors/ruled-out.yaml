      (whose _next/data URL contains a build id that changes on every deploy).
      And the detail JSON's own salaryMin/salaryMax are in THOUSANDS (50, 60)
      where the list API and the JobPosting block are in euros (50000, 60000) —
      build_offer lets detail win on overlap, so a connector mapping salary from
      the detail page would report a 50-euro job and pass every gate.
    retest: "curl -s --compressed -A \"integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)\" 'https://www.getmanfred.com/api/v2/public/offers?lang=ES&onlyActive=true&currency=%E2%82%AC' | python3 -c \"import json,sys; d=json.load(sys.stdin); print(len(d), sum(1 for o in d if o['salaryTo']))\"  # prints '21 21' today"

  - site: remoteok.com
    was: "ruled out yesterday under javascript_rendered — <tr class=\"placeholder job\"> rows, no advert text in the served bytes"
    now: >
      https://remoteok.com/?tags=dev&action=get_jobs&premium=0&offset=
      — the request that fills those placeholders, and it answers with ordinary
      HTML: 50 <tr data-slug="…"> rows per response, each carrying the title,
      the company, the stack and, where the employer gave one, the salary.
      Markup, so the existing selector route reads it with no engine change.
    lesson: >
      the placeholder rows were real evidence and pointed the wrong way. A
      literal placeholder is proof that something fills it, which makes a board
      MORE likely to have a readable endpoint, not less. `offset` is a record
      cursor (0, 50, 100), not a page number, so pagination.mode stays `none`
      until the engine can express a cursor — the same limit himalayas_en
      records.
    retest: "curl -s --compressed -A \"integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)\" 'https://remoteok.com/?tags=dev&action=get_jobs&premium=0&offset=' | grep -c 'data-slug='  # prints 50 today"

  - site: usajobs.gov
    was: >
      ruled out yesterday under javascript_rendered as "not salvageable without
      a headless browser", with an api_note adding that data.usajobs.gov was
      deliberately not used because "a connector pointed at JSON is the same
      silent-nothing with extra steps". Both halves are now wrong, for
      different reasons.
    now: >
      POST https://www.usajobs.gov/Search/ExecuteSearch with
      {"Keyword":"python","ResultsPerPage":25} — the site's OWN front-end
      search, not the developer API. It answers 200 with 25 rows carrying
      Title, SalaryDisplay, MinimumRange, LocationDisplay, Agency and an
      absolute PositionURI, plus a Pager giving the total. **No key, no cookie,
      no session**: measured with a bare curl and this tool's product token,
      after the capture showed the request. The api_note's second half also
      expired the day it was written — #259 shipped the from_json route.
    still_blocked_by: >
      the engine issues GETs. `ListPage.url_pattern` is a URL and there is
      nowhere to put a method or a request body, so this endpoint cannot be
      expressed as a connector today. That is a named, small engine gap with a
      live example, which is a better thing to have than a board filed under a
      reason that was never true.
    lesson: >
      an API key on the *developer* API says nothing about the *website's* API.
      Yesterday's entry checked data.usajobs.gov (401 without an
      Authorization-Key, still true) and generalised from it to the whole
      domain. The front end had to be able to search without a key, because it
      searches for logged-out visitors — which was deducible without a capture,
      and was not deduced.
    retest: "curl -s -X POST -H 'Content-Type: application/json' -A \"integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)\" -d '{\"Keyword\":\"python\",\"ResultsPerPage\":25}' 'https://www.usajobs.gov/Search/ExecuteSearch' | python3 -c \"import json,sys; print(len(json.load(sys.stdin)['Jobs']))\"  # prints 25 today"

# ---------------------------------------------------------------------------
# Ruled out because ROBOTS refuses us — the `*` group, not an AI-agent group.
# These are settled. Re-reading them is only worth it if robots.txt changes.
robots_refused:
  - site: euraxess.ec.europa.eu
    checked: 2026-08-30
    rule: "Disallow: /jobs/*  — the last line of the single `User-agent: *` group"
    detail: >
      `Allow: /jobs` (5 octets) loses to `Disallow: /jobs/*` (7 octets) under
      RFC 9309 §2.2.2 longest-match. Independently, `Disallow: /*?` forbids every
      paginated URL. Verified with the repo matcher: /jobs/search, /jobs/search?page=1
      and /jobs/<id> are all False; bare /jobs is True but serves funding
      programmes, not adverts. The national mirrors (euraxess.es) serve a
      byte-identical file, so there is no locale escape hatch.
    note: >
      `Disallow: /*?` ships in Drupal's default robots.txt. Grep for it before
      declaring `mode: query_param` on ANY Drupal-backed board.
    retest: "curl -s https://euraxess.ec.europa.eu/robots.txt | tail -3"

  - site: ziprecruiter.com
    checked: 2026-08-30
    rule: "the `*` group disallows `/jobs-search`, which is the results path"
    retest: "uv run python3 -c \"from integral.robots import Robots; print(Robots().allows('https://www.ziprecruiter.com/jobs-search?search=python'))\"  # False today"

  - site: dice.com
    checked: 2026-08-30
    rule: "the `*` group disallows the query form of /jobs; bare /jobs is allowed but is not a results page"
    retest: "uv run python3 -c \"from integral.robots import Robots; print(Robots().allows('https://www.dice.com/jobs?q=python'))\"  # False today"

  - site: boards.greenhouse.io
    checked: 2026-08-30
    rule: "the `*` group disallows the embedded job-board path"
    note: "per-employer ATS board rather than a job board; low value even if it opened"

