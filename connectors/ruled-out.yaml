    # the survey record that led there, because the correction is the lesson;
    # the package is the current statement of what the board serves and how it
    # is read, and the counts below are the ones measured on the day, not today.
    was: >
      ruled out yesterday under javascript_rendered, with the note "there is
      nothing to select even in principle". That reading of the served list HTML
      was correct and is unchanged; the ruling drawn from it was not.
    now: >
      https://www.getmanfred.com/api/v2/public/offers?lang=ES&onlyActive=true&currency=%E2%82%AC
      — a public JSON array the list page fetches on load. 21 active offers,
      each with salaryTo, salaryFrom, currency, company.name, remotePercentage,
      position, slug and id, in euros. It answers a plain curl under this tool's
      own product token; no browser, no key, no cookie, and robots.txt is a bare
      `User-agent: * / Allow: /` with the API on no disallowed path (re-checked
      2026-08-31, after the capture, per test 3's second half).

      Count the figures carefully, because the first draft of this entry did
      not: **21 of 21 carry a salary ceiling, and 12 of 21 carry a floor.** The
      other 9 send `salaryFrom: 0`, which is a sentinel for "not stated" and not
      a wage — a connector mapping it straight through would publish nine offers
      paying from zero euros. The values are JSON numbers, not strings, so a
      truth test on `salaryFrom` is what distinguishes them; `sum(1 for o in d
      if o['salaryTo'])` counts ceilings and was misread as counting bands.
    lesson: >
      the capture took four commands to read and the ruling had stood for a day.
      Test 3 above exists because of this entry. Two details are worth carrying
      to whoever writes the connector.

      **The detail JSON's own salaryMin/salaryMax are in THOUSANDS** (50, 60)
      where the list API is in euros (50000, 60000). `build_offer` lets detail
      win on overlap, so a connector mapping salary from the detail page would
      report a 50-euro job and pass every gate. The fix is not a scale factor in
      the connector file: it is to declare no salary on the detail route at all,
      so the list API's euros are the only figures that reach `build_offer`.
      Verified on offer 8451 (2026-08-31): list says 50000/60000, detail says
      50/60, same advert.

      **There is no `script[id="jobPostingSchema"]`.** An earlier draft of this
      entry said there was, and named it the cleaner detail surface; it was
      checked on 2026-08-31 against a real advert and the page carries zero
      `application/ld+json` blocks. What exists is `offer.jsonld` — a *string*
      of JSON nested inside the `__NEXT_DATA__` document, holding a correct
      JobPosting with baseSalary in euros and unitText YEAR. `dig` returns a
      string, and this engine has no step that parses a field's value as a
      second document, so that correct salary is unreachable today. It is worth
      knowing anyway: it is the board's own statement that the band is annual,
      which is why the connector leaves `salary_period` absent rather than
      inventing one.

      The wrong claim survived a day and a PR because it was plausible and
      nobody re-fetched the page. The reason it was plausible is that the
      *listing* page was never the surface in question, and the note was written
      from memory of a different board.
    retest: "curl -s --compressed -A \"integral-job-search/0.1 (+https://github.com/nuncaeslupus/integral-job-search)\" 'https://www.getmanfred.com/api/v2/public/offers?lang=ES&onlyActive=true&currency=%E2%82%AC' | python3 -c \"import json,sys; d=json.load(sys.stdin); print(len(d), sum(1 for o in d if o['salaryTo']))\"  # prints '20 20' today (2026-09-02; it was '21 21' on 08-31 — the board is small and it moves daily, so a different pair here is not a regression)"

