id: contract_stability
kind: hard
polarity: unipolar
group: dealbreakers
label:
  en: Contract stability
  es: Estabilidad contractual
  ca: Estabilitat contractual
definition: >
  How durable the engagement is: an open-ended employment contract at one end,
  fixed-term, freelance or self-employed billing at the other.
levels:
  - value: 0.0
    label:
      en: "Freelance / self-employed"
      es: "Autónomo o freelance"
      ca: "Autònom o freelance"
    tell: "you invoice the employer; there is no employment contract"
  - value: 0.3
    label:
      en: "Fixed-term"
      es: "Temporal"
      ca: "Temporal"
    tell: "a contract with a stated end — a project, a cover, a season"
  - value: 0.9
    label:
      en: "Open-ended"
      es: "Indefinido"
      ca: "Indefinit"
    tell: "an open-ended employment contract, stated as such"
elicitation:
  questions:
    - id: cs_q1
      text:
        en: >
          Walk me through the contract types you have worked under. Which one made you
          change how you planned your life, and how?
        es: >
          Repasa los tipos de contrato bajo los que has trabajado. ¿Cuál te hizo cambiar
          cómo planificabas tu vida, y cómo?
        ca: >
          Repassa els tipus de contracte sota els quals has treballat. Quin et va fer
          canviar com planificaves la teva vida, i com?
extraction:
  # The Spanish and Catalan lists carry each other's spellings, and that is not
  # duplication for its own sake: feinaactiva renders its structured fields
  # ("Contracte laboral indefinit", "Jornada completa") in Catalan on adverts
  # whose body is Spanish, so a `contrato indefinido`-only Spanish list reads
  # nothing on half the Spanish corpus. The alternations below are written to
  # tolerate the ES/CA cognate pair, so both language slices reach the same
  # statements.
  cues:
    en:
      - pattern: "permanent\\s+(contract|position|role)|full-?time\\s+employee|open-?ended\\s+contract|indefinite\\s+contract"
        value: 0.9
        negatable: true
      - pattern: "contractor|freelance"
        value: 0.2
        negatable: false
      - pattern: "\\b\\d+\\s*-?\\s*month\\s+contract|fixed-?term|temporary\\s+contract|maternity\\s+cover|seasonal\\s+contract"
        value: 0.3
        negatable: false
    es:
      - pattern: "contrat\\w*\\s+(laboral\\s+|de\\s+trabajo\\s+|de\\s+treball\\s+)?(indefinido|indefinida|indefinit)\\b|contrat\\w*\\s*:\\s*(indefinido|indefinit)\\b|contrataci[óo]n\\s+indefinid|contractaci[óo]\\s+indefinit"
        value: 0.9
        negatable: true
      - pattern: "aut[óo]nomo|aut[òo]nom\\b|freelance|factura(ci[óo]n)?\\s+por\\s+horas"
        value: 0.2
        negatable: false
      - pattern: "contrat\\w*\\s+(laboral\\s+)?(temporal|eventual)|obra\\s+y\\s+servicio|contrato\\s+en\\s+pr[áa]cticas|interinidad|sustituci[óo]n\\s+(por\\s+|de\\s+)?baja|contrato\\s+de\\s+relevo|fij[oa]\\s+discontinu"
        value: 0.3
        negatable: false
    ca:
      - pattern: "contract\\w*\\s+(laboral\\s+|de\\s+treball\\s+)?(indefinit|indefinida|indefinido)\\b|contract\\w*\\s*:\\s*(indefinit|indefinido)\\b|contractaci[óo]\\s+indefinit|contrataci[óo]n\\s+indefinid"
        value: 0.9
        negatable: true
      - pattern: "aut[òo]nom\\b|aut[óo]nomo|freelance"
        value: 0.2
        negatable: false
      - pattern: "contract\\w*\\s+(laboral\\s+)?(temporal|eventual)|contract\\w*\\s+(laboral\\s+)?per\\s+substituci|substituci[óo]\\s+(per\\s+|de\\s+)?baixa|contracte\\s+en\\s+pr[àa]ctiques|interinitat|fix\\s+discontinu"
        value: 0.3
        negatable: false
  gold:
    - ad_id: wwr-gusto-inc-staff-software-engineer-ai-developer-tools
      language: en
      span: "that reflects the people we serve.\n\n\nAll full-time employees receive competitive base pay, benefits, and equity (RSUs) — because everyone who helps build Gusto should share"
      value: 0.9
      derived_from: cue
    - ad_id: tecnoempleo-08a719c5825dd3fa5043
      language: es
      span: "metodologías de referencia. Condiciones Contrato Indefinido Lugar de trabajo Alcobendas (Madrid) Modalidad Híbrido (60 teletrabajo) Horario Jornada completa Salario En función"
      value: 0.9
      derived_from: cue
    - ad_id: feinaactiva-FA92317375
      language: ca
      span: "Jornada intensiva\n\nAltres dades d'interès: - Contracte indefinit.\n- Estabilitat laboral. Carrera a llarg termini.\n- Jornada completa, 40 h/setmanals, amb horari flexible d'entrada"
      value: 0.9
      derived_from: cue
methods_ref: METHODS.md#26-ad-wording-as-signal
