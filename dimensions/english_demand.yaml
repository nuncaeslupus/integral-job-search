id: english_demand
kind: hard
polarity: unipolar
group: dealbreakers
label:
  en: English demand
  es: Exigencia de inglés
  ca: Exigència d'anglès
definition: >
  How much working English the role requires, from none through reading documentation to
  conducting the whole job in it.
levels:
  - value: 0.0
    label:
      en: "Not required"
      es: "No requerido"
      ca: "No requerit"
    tell: "the ad says English is not needed, or asks for none at all"
  - value: 0.6
    label:
      en: "Intermediate"
      es: "Intermedio (B1–B2)"
      ca: "Intermedi (B1–B2)"
    tell: "B1/B2, or enough to read documentation and follow written threads"
  - value: 1.0
    label:
      en: "The job runs in English"
      es: "El día a día en inglés"
      ca: "El dia a dia en anglès"
    tell: "C1/fluent/native, or English named as the working language"
elicitation:
  questions:
    - id: ed_q1
      text:
        en: >
          Describe a work situation where the language was not your first. What did you
          avoid saying because of it?
        es: >
          Describe una situación de trabajo en un idioma que no era el tuyo. ¿Qué
          evitaste decir por ello?
        ca: >
          Descriu una situació de feina en una llengua que no era la teva. Què vas
          evitar dir per això?
extraction:
  cues:
    en:
      - pattern: "fluent\\s+english|native\\s+english|english\\s+is\\s+(our|the)\\s+(working|company)\\s+language"
        value: 1.0
        negatable: false
      - pattern: "english\\s*\\(?\\s*(b2|c1|c2)"
        value: 0.7
        negatable: false
      - pattern: "english\\s+(is\\s+)?not\\s+required"
        value: 0.0
        denies: true
      - pattern: "english\\s+(is\\s+)?optional"
        value: 0.0
        negatable: false
    es:
      - pattern: "ingl[ée]s\\s*\\(?\\s*(alto|fluido|c1|c2)"
        value: 0.9
        negatable: true
      - pattern: "ingl[ée]s\\s*\\(?\\s*(b1|b2|medio|intermedio)"
        value: 0.6
        negatable: false
      - pattern: "ingl[ée]s\\s+no\\s+(necesario|requerido)|no\\s+se\\s+requiere\\s+ingl[ée]s"
        value: 0.0
        denies: true
    ca:
      - pattern: "angl[èe]s\\s*\\(?\\s*(c1|c2|alt|parlat\\s+superior)"
        value: 0.9
        negatable: false
      - pattern: "angl[èe]s\\s*\\(?\\s*(b1|b2|parlat\\s+(mitj[àa]|b[àa]sic))"
        value: 0.6
        negatable: false
      - pattern: "angl[èe]s\\s+no\\s+(necessari|requerit)"
        value: 0.0
        denies: true
  gold:
    - ad_id: manfred-8389
      language: es
      span: "persistencia.\n* **Nivel de Inglés Alto**: Tu día a día será completamente en este idioma.💂\n\n**Suma puntos 🎁**"
      value: 1.0
      derived_from: cue
    - ad_id: feinaactiva-09202624459
      language: ca
      span: "anglès (parlat Superior, escrit Superior)\n\ncatalà (parlat Superior, escrit Superior)"
      value: 1.0
      derived_from: cue
    - ad_id: feinaactiva-09202623802
      language: ca
      span: "Anglès (B2), català i castellà (C1).\nJornada completa. Retribució 3.085,71*14."
      value: 0.6
      derived_from: cue
methods_ref: METHODS.md#26-ad-wording-as-signal
