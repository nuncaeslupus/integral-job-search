id: english_demand
kind: hard
polarity: unipolar
group: requirements
label:
  en: English demand
  es: Exigencia de inglés
  ca: Exigència d'anglès
definition: >
  How much working English the role requires, from none through reading documentation to
  conducting the whole job in it.
levels:
  - value: 0.0
    label:
      en: "Not required"
      es: "No requerido"
      ca: "No requerit"
    tell: "the ad says English is not needed, or asks for none at all"
  - value: 0.6
    label:
      en: "Intermediate"
      es: "Intermedio (B1–B2)"
      ca: "Intermedi (B1–B2)"
    tell: "B1/B2, or enough to read documentation and follow written threads"
  - value: 1.0
    label:
      en: "The job runs in English"
      es: "El día a día en inglés"
      ca: "El dia a dia en anglès"
    tell: "C1/fluent/native, or English named as the working language"
elicitation:
  questions:
    - id: ed_q1
      text:
        en: >
          Describe a work situation where the language was not your first. What did you
          avoid saying because of it?
        es: >
          Describe una situación de trabajo en un idioma que no era el tuyo. ¿Qué
          evitaste decir por ello?
        ca: >
          Descriu una situació de feina en una llengua que no era la teva. Què vas
          evitar dir per això?
extraction:
  cues:
    en:
      - pattern: "fluent\\s+english|native\\s+english|english\\s+is\\s+(our|the)\\s+(working|company)\\s+language|excellent\\s+(written\\s+and\\s+spoken\\s+)?english|advanced\\s+english"
        value: 1.0
        negatable: true
      - pattern: "english\\s*\\(?\\s*(b1|b2|c1|c2)|(good|professional|working)\\s+(level\\s+of\\s+)?english|english\\s+(proficiency|skills)"
        value: 0.7
        negatable: true
      - pattern: "english[^.\\n]{0,30}\\b(not|no)\\s+(required|needed|necessary|mandatory)|\\b(no|not)\\b[^.\\n]{0,40}\\benglish\\b[^.\\n]{0,25}\\b(is\\s+)?(required|needed|necessary)|english\\s+(is\\s+)?not\\s+required"
        value: 0.0
        denies: true
      - pattern: "english\\s+(is\\s+)?optional"
        value: 0.0
        negatable: false
    # `Anglès (parlat Superior, escrit Superior)` is feinaactiva's language
    # field and appears on Spanish-language adverts too, so both slices read it
    # — see the note on `contract_stability`.
    es:
      # Both word orders. Spanish and Catalan put the level either side of the
      # language — "inglés nivel alto" and "nivel avanzado de inglés" are the
      # same statement — and a cue list that reads only one of them is blind to
      # half the adverts that make it.
      - pattern: "ingl[ée]s\\s*[:(]?\\s*(nivel\\s+)?(alto|avanzado|fluido|nativo|biling[üu]e|c1|c2)|nivel\\s+(alto|avanzado|nativo|biling[üu]e|c1|c2)\\s+de\\s+ingl[ée]s|angl[èe]s\\s*[:(]?\\s*(nivell\\s+)?(c1|c2|alt|avan[çc]at|natiu|parlat\\s+superior)|nivell\\s+(alt|avan[çc]at|natiu|c1|c2)\\s+d[e']\\s*angl[èe]s"
        value: 0.9
        negatable: true
      - pattern: "ingl[ée]s\\s*[:(]?\\s*(nivel\\s+)?(b1|b2|medio|intermedio|suficiente)|nivel\\s+(medio|intermedio|b1|b2|suficiente)\\s+de\\s+ingl[ée]s|nivel\\s+de\\s+ingl[ée]s\\s+(suficiente|medio|intermedio)|angl[èe]s\\s*[:(]?\\s*(nivell\\s+)?(b1|b2|mitj[àa]|parlat\\s+mitj[àa])|nivell\\s+(b1|b2|mitj[àa]|suficient)\\s+d[e']\\s*angl[èe]s|ingl[ée]s\\s+(con\\s+)?capacidad\\s+para\\s+desenvolverse"
        value: 0.6
        negatable: true
      - pattern: "ingl[ée]s[^.\\n]{0,25}\\bno\\s+(es\\s+)?(necesario|requerido|imprescindible)|no\\s+se\\s+(requiere|precisa|necesita)\\s+(el\\s+)?ingl[ée]s|angl[èe]s[^.\\n]{0,25}\\bno\\s+([ée]s\\s+)?(necessari|requerit|imprescindible)|no\\s+es\\s+(requereix|necessita)\\s+(l['’])?angl[èe]s|ingl[ée]s\\s+no\\s+(necesario|requerido)|angl[èe]s\\s+no\\s+(necessari|requerit)"
        value: 0.0
        denies: true
    ca:
      - pattern: "angl[èe]s\\s*[:(]?\\s*(nivell\\s+)?(c1|c2|alt|avan[çc]at|natiu|parlat\\s+superior)|nivell\\s+(alt|avan[çc]at|natiu|c1|c2)\\s+d[e']\\s*angl[èe]s|ingl[ée]s\\s*[:(]?\\s*(nivel\\s+)?(alto|avanzado|fluido|nativo|c1|c2)|nivel\\s+(alto|avanzado|nativo|c1|c2)\\s+de\\s+ingl[ée]s"
        value: 0.9
        negatable: true
      - pattern: "angl[èe]s\\s*[:(]?\\s*(nivell\\s+)?(b1|b2|mitj[àa]|parlat\\s+mitj[àa])|nivell\\s+(b1|b2|mitj[àa]|suficient)\\s+d[e']\\s*angl[èe]s|ingl[ée]s\\s*[:(]?\\s*(nivel\\s+)?(b1|b2|medio|intermedio|suficiente)|nivel\\s+(medio|intermedio|b1|b2|suficiente)\\s+de\\s+ingl[ée]s|nivel\\s+de\\s+ingl[ée]s\\s+(suficiente|medio|intermedio)"
        value: 0.6
        negatable: true
      - pattern: "angl[èe]s[^.\\n]{0,25}\\bno\\s+([ée]s\\s+)?(necessari|requerit|imprescindible)|no\\s+es\\s+(requereix|necessita)\\s+(l['’])?angl[èe]s|ingl[ée]s[^.\\n]{0,25}\\bno\\s+(es\\s+)?(necesario|requerido|imprescindible)|no\\s+se\\s+(requiere|precisa|necesita)\\s+(el\\s+)?ingl[ée]s|angl[èe]s\\s+no\\s+(necessari|requerit)|ingl[ée]s\\s+no\\s+(necesario|requerido)"
        value: 0.0
        denies: true
  gold:
    - ad_id: manfred-8389
      language: es
      span: "persistencia.\n* **Nivel de Inglés Alto**: Tu día a día será completamente en este idioma.💂\n\n**Suma puntos 🎁**"
      value: 1.0
      derived_from: cue
    - ad_id: feinaactiva-09202624459
      language: ca
      span: "anglès (parlat Superior, escrit Superior)\n\ncatalà (parlat Superior, escrit Superior)"
      value: 1.0
      derived_from: cue
    - ad_id: feinaactiva-09202623802
      language: ca
      span: "Anglès (B2), català i castellà (C1).\nJornada completa. Retribució 3.085,71*14."
      value: 0.6
      derived_from: cue
methods_ref: METHODS.md#26-ad-wording-as-signal
