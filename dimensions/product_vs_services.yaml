id: product_vs_services
kind: soft
polarity: bipolar
group: the_work
label:
  en: Product versus services
  es: Producto frente a servicios
  ca: Producte enfront de serveis
definition: >
  Whether the work is on the employer's own product, or delivered into a client's
  organisation through a consultancy or staffing arrangement.
levels:
  - value: -0.7
    label:
      en: "Consultancy or staffing"
      es: "Consultora o cesión"
      ca: "Consultora o cessió"
    tell: "you are placed with the employer's clients, or billed into their projects"
  - value: 0.0
    label:
      en: "Not stated"
      es: "No se dice"
      ca: "No es diu"
    tell: "the ad never says whose product you would be building"
  - value: 0.7
    label:
      en: "The employer's own product"
      es: "Producto propio"
      ca: "Producte propi"
    tell: "the thing you build is the thing the employer sells"
elicitation:
  questions:
    - id: pvs_q1
      text:
        en: >
          Describe who used the last thing you built. Did you ever meet them, and who
          employed you while you built it?
        es: >
          Describe quién usaba lo último que construiste. ¿Llegaste a conocerlos y quién
          te empleaba mientras lo construías?
        ca: >
          Descriu qui feia servir l'última cosa que vas construir. Els vas arribar a
          conèixer i qui et contractava mentre la construïes?
extraction:
  cues:
    # Bipolar, so a reading needs two matches that agree (T59). The staffing
    # cues are split across two patterns for that reason and not by accident:
    # an advert placing someone with a client says so twice — it names itself a
    # consultancy *and* describes the placement — and one of the two alone is
    # the passing mention the corroboration rule exists to distrust.
    en:
      - pattern: "our\\s+own\\s+product|we\\s+build\\s+our\\s+own|the\\s+product\\s+we\\s+build|our\\s+(platform|saas)|\\bsaas\\b"
        value: 0.7
        negatable: false
      - pattern: "consultanc(y|ies)|client\\s+site|staff(ing|\\s+augmentation)|our\\s+client\\s+is|\\bconsultants?\\b|systems?\\s+integrator"
        value: -0.7
        negatable: false
      - pattern: "end\\s+users?"
        value: 0.4
        negatable: false
      - pattern: "join\\s+(one\\s+of\\s+)?our\\s+clients?|placed\\s+with\\s+(a|our)\\s+client|on\\s+behalf\\s+of\\s+our\\s+client"
        value: -0.5
        negatable: false
    es:
      - pattern: "producto\\s+propio|nuestro\\s+producto|nuestra\\s+plataforma|producte\\s+propi|\\bsaas\\b|dise[ñn]o\\s+y\\s+fabricaci[óo]n|somos\\s+fabricantes?"
        value: 0.7
        negatable: false
      - pattern: "consultor(a|es|as|ía|ia)\\b|c[áa]rnica|cliente\\s+final|client\\s+final|\\bETT\\b|outsourcing|empresa\\s+de\\s+servicios|partner\\s+(estrat[ée]gico|tecnol[óo]gico)"
        value: -0.7
        negatable: false
      - pattern: "asignaci[óo]n\\s+a\\s+proyecto|para\\s+incorporar(se|te)?\\s+a\\s+(un|una|uno)\\b|nuestros\\s+clientes|els\\s+nostres\\s+clients|principales\\s+clientes|proyecto\\s+estable"
        value: -0.5
        negatable: false
    ca:
      - pattern: "producte\\s+propi|el\\s+nostre\\s+producte|la\\s+nostra\\s+plataforma|producto\\s+propio|\\bsaas\\b|disseny\\s+i\\s+fabricaci[óo]|som\\s+fabricants?"
        value: 0.7
        negatable: false
      - pattern: "consultor(a|es|es|ia|ía)\\b|consultoria|client\\s+final|cliente\\s+final|\\bETT\\b|outsourcing|empresa\\s+de\\s+serveis|partner\\s+(estrat[èe]gic|tecnol[òo]gic)"
        value: -0.7
        negatable: false
      - pattern: "assignaci[óo]\\s+a\\s+projecte|per\\s+incorporar(-se|-te)?\\s+a\\s+(un|una)\\b|els\\s+nostres\\s+clients|nuestros\\s+clientes|principals\\s+clients|projecte\\s+estable"
        value: -0.5
        negatable: false
  gold:
    - ad_id: wwr-toptal-senior-software-engineer-for-ai-powered-banking-platform
      language: en
      span: "Our client is a fast-growing, Series A-backed AI company delivering agentic AI solutions to banks and credit unions. Their platform is already serving over 100 financial"
      value: -0.7
      derived_from: cue
    - ad_id: tecnoempleo-0ccd13f62257530f7946
      language: es
      span: "Descripción de la empresa Devoteam es una consultora europea líder enfocada en estrategia digital plataformas tecnológicas ciberseguridad y transformación empresarial a través de la tecnología."
      value: -0.7
      derived_from: cue
    - ad_id: feinaactiva-FA92317375
      language: ca
      span: "DESENVOLUPADOR .NET (H/D) per a consultoria tecnològica en creixement, líder en el seu sector, experts en desenvolupament web i alta motivació per la tecnologia punta.\n\n- Desenvolupar"
      value: -0.7
      derived_from: cue
