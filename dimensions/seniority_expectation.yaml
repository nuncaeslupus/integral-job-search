id: seniority_expectation
kind: hard
polarity: unipolar
group: dealbreakers
label:
  en: Seniority expectation
  es: Nivel de senioridad
  ca: Nivell de senioritat
definition: >
  How much prior experience the ad requires, expressed as a level name or a stated
  number of years.
levels:
  - value: 0.2
    label:
      en: "Junior"
      es: "Junior"
      ca: "Júnior"
    tell: "no experience required, or an explicit junior/graduate/trainee opening"
  - value: 0.5
    label:
      en: "Mid-level"
      es: "Intermedio"
      ca: "Intermedi"
    tell: "a few years asked for, or a plain practitioner title with no seniority word"
  - value: 0.8
    label:
      en: "Senior"
      es: "Senior"
      ca: "Sènior"
    tell: "senior/lead/principal in the title, or a stated floor of many years"
elicitation:
  questions:
    - id: se_q1
      text:
        en: >
          Tell me about a time you were the most experienced person in the room, and a
          time you were the least. Which suited you?
        es: >
          Cuéntame una vez en que eras la persona con más experiencia de la sala, y otra
          en que eras la que menos. ¿Cuál te sentó mejor?
        ca: >
          Explica'm una vegada en què eres la persona amb més experiència de la sala, i
          una altra en què eres la que menys. Quina et va anar millor?
extraction:
  cues:
    # Three rungs, and every one of them is above zero: this dimension has no
    # "absent" class, so *any* statement of what experience the advert wants is
    # a reading. The numeric cues split on the number the advert states and are
    # written not to overlap, so two rungs never average into a value between
    # them: months 0–11 and "0 years" are junior, 1–4 years and 12–59 months are
    # mid, 5+ years and 60+ months are senior.
    en:
      - pattern: "\\bsenior\\b|\\bstaff\\s+(\\w+\\s+){0,2}(engineer|developer|architect|designer|analyst|scientist|consultant|programmer)\\b|\\bprincipal\\b|\\b(tech(nical)?|team|squad|engineering)\\s+lead\\b|\\blead\\s+(\\w+\\s+){0,2}(engineer|developer|architect|designer|analyst|scientist|consultant|programmer)\\b|\\bhead\\s+of\\b"
        value: 0.8
        negatable: false
      - pattern: "\\b([5-9]|[1-9][0-9])\\+?\\s*years?\\b|\\b\\d+\\s*(to|-)\\s*([5-9]|[1-9][0-9])\\s*years?\\b"
        value: 0.8
        negatable: false
      - pattern: "\\bjunior\\b|entry[\\s-]level|\\bgraduate\\b|\\bintern(ship)?\\b|\\btrainee\\b|no\\s+experience\\s+(is\\s+)?(required|needed)"
        value: 0.2
        negatable: false
      - pattern: "\\b[1-4]\\+?\\s*years?\\b|\\b\\d+\\s*(to|-)\\s*[1-4]\\s*years?\\b|proven\\s+experience|demonstrable\\s+experience"
        value: 0.5
        negatable: false
    es:
      - pattern: "\\bsenior\\b|\\bs[èe]nior\\b|oficial\\s+de\\s+1|\\b(buscamos|busquem|seleccionamos|seleccionem|precisamos|incorporamos|incorporem|se\\s+busca|es\\s+busca|se\\s+precisa|es\\s+precisa|se\\s+necesita|es\\s+necessita)\\s+[^.\\n]{0,25}\\b(jefe|jefa|cap|responsable)\\s+de\\b|\\b(tech(nical)?|team|squad|engineering)\\s+lead\\b|\\blead\\s+(\\w+\\s+){0,2}(engineer|developer|architect|designer|analyst|scientist|consultant|programmer)\\b"
        value: 0.8
        negatable: false
      - pattern: "(m[áa]s\\s+de\\s+)?([5-9]|[1-9][0-9])\\s*a[ñn]os\\s+de\\s+experiencia|experiencia\\s+(m[íi]nima\\s+)?(de\\s+)?([5-9]|[1-9][0-9])\\s*a[ñn]os|experi[èe]ncia\\s+(de\\s+)?([5-9]|[1-9][0-9])\\s*anys|experi[èe]ncia\\s+([6-9][0-9]|[1-9][0-9]{2,})\\s*mesos|experi\\w+\\s+de\\s+\\d+\\s+a\\s+([5-9]|[1-9][0-9])\\s*(anys|a[ñn]os)"
        value: 0.8
        negatable: false
      - pattern: "\\bjunior\\b|\\bj[úu]nior\\b|reci[ée]n\\s+titulad|sin\\s+experiencia\\s+previa|no\\s+se\\s+requiere\\s+experiencia|experi[èe]ncia\\s+0\\s*(anys|mesos)|experi[èe]ncia\\s+([0-9]|1[01])\\s*mesos\\b|\\bbecari|\\bpr[áa]cticas\\b"
        value: 0.2
        negatable: true
      - pattern: "experiencia\\s+(m[íi]nima\\s+)?(de\\s+)?[1-4]\\s*a[ñn]os|experi[èe]ncia\\s+(de\\s+)?[1-4]\\s*anys|experi[èe]ncia\\s+(1[2-9]|[2-5][0-9])\\s*mesos\\b|experiencia\\s+(previa\\s+|m[íi]nima\\s+)?demostrable|se\\s+requiere\\s+experiencia|experi\\w+\\s+de\\s+\\d+\\s+a\\s+[1-4]\\s*(anys|a[ñn]os)"
        value: 0.5
        negatable: false
    ca:
      - pattern: "\\bs[èe]nior\\b|\\bsenior\\b|oficial\\s+de\\s+1|\\b(buscamos|busquem|seleccionamos|seleccionem|precisamos|incorporamos|incorporem|se\\s+busca|es\\s+busca|se\\s+precisa|es\\s+precisa|se\\s+necesita|es\\s+necessita)\\s+[^.\\n]{0,25}\\b(jefe|jefa|cap|responsable)\\s+de\\b|\\b(tech(nical)?|team|squad|engineering)\\s+lead\\b|\\blead\\s+(\\w+\\s+){0,2}(engineer|developer|architect|designer|analyst|scientist|consultant|programmer)\\b"
        value: 0.8
        negatable: false
      - pattern: "experi[èe]ncia\\s+(de\\s+)?([5-9]|[1-9][0-9])\\s*anys|experi[èe]ncia\\s+([6-9][0-9]|[1-9][0-9]{2,})\\s*mesos|m[ée]s\\s+de\\s+([5-9]|[1-9][0-9])\\s*anys\\s+d[e']\\s*experi[èe]ncia|experi\\w+\\s+de\\s+\\d+\\s+a\\s+([5-9]|[1-9][0-9])\\s*(anys|a[ñn]os)"
        value: 0.8
        negatable: false
      - pattern: "\\bj[úu]nior\\b|\\bjunior\\b|sense\\s+experi[èe]ncia|acabat\\s+de\\s+titular|experi[èe]ncia\\s+0\\s*(anys|mesos)|experi[èe]ncia\\s+([0-9]|1[01])\\s*mesos\\b|\\bbecari|\\bpr[àa]ctiques\\b"
        value: 0.2
        negatable: true
      - pattern: "experi[èe]ncia\\s+(de\\s+)?[1-4]\\s*anys|experi[èe]ncia\\s+(1[2-9]|[2-5][0-9])\\s*mesos\\b|experi[èe]ncia\\s+(pr[èe]via\\s+)?demostrable|es\\s+requereix\\s+experi[èe]ncia|experi\\w+\\s+de\\s+\\d+\\s+a\\s+[1-4]\\s*(anys|a[ñn]os)"
        value: 0.5
        negatable: false
  gold:
    - ad_id: manfred-8419
      language: en
      span: "want to join the adventure?** **🧳**\n\n**As a Senior QA Engineer** at **FCTG,** **you will be fundamental in scaling their platform globally, guaranteeing product"
      value: 0.8
      derived_from: cue
    - ad_id: manfred-8360
      language: es
      span: "segundo** sin que eche humo.\n\nBuscan a un/a **Senior Go Developer** que no necesite que le expliquen qué es un *offset* de **Kafka** o cómo domar una arquitectura"
      value: 0.8
      derived_from: cue
    - ad_id: feinaactiva-09202623802
      language: ca
      span: "Llicenciatura o Grau en ciències o enginyeria. Experiència de 3 a 5 anys en el sector bancari (Analítica de dades/Bussiness Inteligence). Nivell alt en SQL i fuidesa en Data"
      value: 0.8
      derived_from: cue
