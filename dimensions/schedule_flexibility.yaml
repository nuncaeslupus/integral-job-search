id: schedule_flexibility
kind: soft
polarity: unipolar
group: terms
label:
  en: Schedule flexibility
  es: Flexibilidad horaria
  ca: Flexibilitat horària
definition: >
  How far the working day can be shaped around the person — flexible start and finish,
  compressed Fridays and summers, asynchronous collaboration — rather than fixed to a
  common timetable.
levels:
  - value: 0.0
    label:
      en: "Fixed timetable"
      es: "Horario fijo"
      ca: "Horari fix"
    tell: "stated hours everyone keeps, with no give named"
  - value: 0.4
    label:
      en: "Some give"
      es: "Cierta flexibilidad"
      ca: "Certa flexibilitat"
    tell: "flexible start and finish, or an intensive summer, inside a fixed frame"
  - value: 0.7
    label:
      en: "Shaped around the person"
      es: "Se adapta a la persona"
      ca: "S'adapta a la persona"
    tell: "asynchronous work, compressed weeks, or hours the person genuinely sets"
elicitation:
  questions:
    - id: sf_q1
      text:
        en: >
          Tell me about a week when you had to reshape your working hours. What did you
          change, and who needed to agree to it?
        es: >
          Cuéntame una semana en la que tuviste que reorganizar tu horario. ¿Qué
          cambiaste y quién tuvo que estar de acuerdo?
        ca: >
          Explica'm una setmana en què vas haver de reorganitzar el teu horari. Què vas
          canviar i qui hi havia d'estar d'acord?
extraction:
  cues:
    # A bare `jornada intensiva` is **not** this dimension's 0.4 rung. On these
    # boards it names the shape of a fixed day — one unbroken block, 07:00 to
    # 15:00 — and says nothing about give. The rung's own tell is "flexible
    # start and finish, or **an intensive summer**, inside a fixed frame", so
    # the cue asks for the seasonal or weekday qualifier that makes it one.
    en:
      - pattern: "flexible\\s+(working\\s+)?(hours|schedule|start)|flexitime|flexible\\s+start\\s+and\\s+finish"
        value: 0.7
        negatable: true
      - pattern: "asynchronous|async|summer\\s+hours|compressed\\s+(work\\s+)?week"
        value: 0.6
        negatable: false
      - pattern: "fixed\\s+(hours|schedule)"
        value: 0.0
        negatable: false
    es:
      - pattern: "horario\\s+flexible|jornada\\s+flexible|flexibilidad\\s+horaria|horari\\s+flexible|flexibilitat\\s+hor[àa]ria"
        value: 0.7
        negatable: true
      - pattern: "jornada\\s+intensiva\\s+(en\\s+|els\\s+|los\\s+|de\\s+)?(verano|estiu|julio|agosto|juliol|agost|viernes|divendres)"
        value: 0.6
        negatable: false
      - pattern: "entrada\\s+(y|i)\\s+(salida|sortida)\\s+flexible|flexibilidad\\s+(en\\s+)?(la\\s+)?(hora\\s+de\\s+)?entrada\\s+(y|i)\\s+salida"
        value: 0.4
        negatable: false
      - pattern: "horario\\s+fijo|horari\\s+fix"
        value: 0.0
        negatable: false
    ca:
      - pattern: "horari\\s+flexible|jornada\\s+flexible|flexibilitat\\s+hor[àa]ria|horario\\s+flexible|flexibilidad\\s+horaria"
        value: 0.7
        negatable: true
      - pattern: "jornada\\s+intensiva\\s+(a\\s+l['’]|en\\s+|els\\s+|los\\s+|de\\s+)?(estiu|verano|juliol|agost|julio|agosto|divendres|viernes)"
        value: 0.6
        negatable: false
      - pattern: "entrada\\s+(i|y)\\s+(sortida|salida)\\s+flexible|flexibilitat\\s+(en\\s+)?(l['’]hora\\s+d['’])?entrada\\s+i\\s+sortida"
        value: 0.4
        negatable: false
      - pattern: "horari\\s+fix|horario\\s+fijo"
        value: 0.0
        negatable: false
  gold:
    - ad_id: wwr-maptiler-location-services-engineer-maps-platform-remote-in-europe
      language: en
      span: "all the resources you need for your work.\n\nFlexible working hours to help you easily balance your personal and professional life.\n\nWork remotely from anywhere in Europe, or hang"
      value: 0.7
      derived_from: cue
    - ad_id: tecnoempleo-0e9510e2527fd31cd240
      language: es
      span: "teletrabajo fuera de tu área geográfica habitual Horario flexible de entrada y salida y jornada intensiva viernes y verano. Desarrollo de plan de carrera personalizado formación"
      value: 0.7
      derived_from: cue
    - ad_id: feinaactiva-FA92317375
      language: ca
      span: "- Jornada completa, 40 h/setmanals, amb horari flexible d'entrada i sortida.\n- Possibilitat de 95% teletreball.\n- Ambient multidisciplinari.\n- Equip jove i amb activitats"
      value: 0.7
      derived_from: cue
