id: on_call_load
kind: soft
polarity: unipolar
label:
  en: On-call load
  es: Carga de guardias
  ca: Càrrega de guàrdies
definition: >
  How much out-of-hours availability the role carries: on-call rotations, incident duty,
  and expectations of reachability outside the working day.
elicitation:
  questions:
    - id: ocl_q1
      text:
        en: >
          Tell me about the last time you were called about work outside your hours.
          What happened, and what did it cost you?
        es: >
          Cuéntame la última vez que te llamaron por trabajo fuera de tu horario. ¿Qué
          pasó y qué te costó?
        ca: >
          Explica'm l'última vegada que et van trucar per feina fora del teu horari. Què
          va passar i què et va costar?
extraction:
  cues:
    en:
      - pattern: "on-?call"
        value: 0.8
        negatable: true
      - pattern: "24/7|out\\s+of\\s+hours"
        value: 0.7
        negatable: false
      - pattern: "no\\s+on-?call"
        value: 0.0
        negatable: false
    es:
      - pattern: "guardias"
        value: 0.8
        negatable: true
      - pattern: "disponibilidad\\s+24|retenes?|ret[ée]n"
        value: 0.7
        negatable: false
      - pattern: "sin\\s+guardias"
        value: 0.0
        negatable: false
    ca:
      - pattern: "gu[àa]rdies"
        value: 0.8
        negatable: true
      - pattern: "disponibilitat\\s+24"
        value: 0.7
        negatable: false
      - pattern: "sense\\s+gu[àa]rdies"
        value: 0.0
        negatable: false
  gold:
    - ad_id: wwr-clickhouse-ai-product-engineer-clickstack
      language: en
      span: "2 AM, propose a root cause, and hand the on-call a concise summary by the time they've logged in.\n\nWe're hiring a AI Product Engineer to build agentic capabilities"
      value: 0.8
    - ad_id: manfred-8389
      language: es
      span: "proyecto se quede bloqueado.\n\n**🚨 Sobre las Guardias** (On-Call) Manejar transacciones en tiempo real implica estar alerta, pero en Valsea el descanso es sagrado y"
      value: 0.8
