id: technical_depth
kind: soft
polarity: bipolar
group: the_work
label:
  en: Technical depth
  es: Profundidad técnica
  ca: Profunditat tècnica
definition: >
  Whether the role is engineering hard problems — architecture, performance, systems
  design — or operating and supporting what already exists.
levels:
  - value: -0.6
    label:
      en: "Operating what exists"
      es: "Operar lo que ya existe"
      ca: "Operar el que ja existeix"
    tell: "helpdesk, L2 support, ticket queues, running someone else's system"
  - value: 0.0
    label:
      en: "Not stated"
      es: "No se dice"
      ca: "No es diu"
    tell: "the ad describes duties without saying how hard the engineering is"
  - value: 0.7
    label:
      en: "Engineering hard problems"
      es: "Ingeniería de fondo"
      ca: "Enginyeria de fons"
    tell: "architecture, systems design, scale or performance work"
elicitation:
  questions:
    - id: td_q1
      text:
        en: >
          Tell me about the hardest technical problem you have owned. What made it hard,
          and how long were you inside it?
        es: >
          Cuéntame el problema técnico más difícil que has llevado. ¿Qué lo hacía
          difícil y cuánto tiempo estuviste dentro?
        ca: >
          Explica'm el problema tècnic més difícil que has portat. Què el feia difícil i
          quant de temps hi vas ser a dins?
extraction:
  cues:
    en:
      - pattern: "architect(ure|ing)?|system\\s+design"
        value: 0.7
        negatable: false
      - pattern: "scalab|performance\\s+optimi"
        value: 0.6
        negatable: false
