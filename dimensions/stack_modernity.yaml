id: stack_modernity
kind: soft
polarity: bipolar
group: the_work
label:
  en: Stack modernity
  es: Modernidad del stack
  ca: Modernitat de l'stack
definition: >
  Whether the technology named in the ad is current and actively developed, or a
  long-lived legacy estate being maintained.
levels:
  - value: -0.7
    label:
      en: "Legacy estate"
      es: "Sistemas heredados"
      ca: "Sistemes heretats"
    tell: "COBOL, AS/400, Visual Basic, or the ad's own word for legacy"
  - value: 0.0
    label:
      en: "Not stated"
      es: "No se dice"
      ca: "No es diu"
    tell: "no technology named, or nothing that dates it either way"
  - value: 0.6
    label:
      en: "Current and active"
      es: "Actual y en desarrollo"
      ca: "Actual i en desenvolupament"
    tell: "cloud-native, containers, or a stack in active development today"
elicitation:
  questions:
    - id: sm_q1
      text:
        en: >
          Describe the codebase you last worked in. How old was it, and what did its age
          make impossible?
        es: >
          Describe el código en el que trabajaste por última vez. ¿Qué antigüedad tenía
          y qué hacía imposible esa antigüedad?
        ca: >
          Descriu el codi on vas treballar per última vegada. Quina antiguitat tenia i
          què feia impossible aquesta antiguitat?
extraction:
  cues:
    en:
      - pattern: "kubernetes|terraform|rust\\b|go(lang)?\\b"
        value: 0.6
        negatable: false
      - pattern: "cloud\\s*-?\\s*native|microservices"
        value: 0.5
        negatable: false
      - pattern: "cobol|as/?400|visual\\s+basic|legacy"
        value: -0.7
        negatable: false
    es:
      - pattern: "kubernetes|terraform|microservicios"
        value: 0.6
        negatable: false
      - pattern: "cloud|nube\\s+p[úu]blica"
        value: 0.4
        negatable: false
      - pattern: "cobol|as/?400|legado|obsolet"
        value: -0.7
        negatable: false
    ca:
      - pattern: "kubernetes|terraform|microserveis"
        value: 0.6
        negatable: false
      - pattern: "n[úu]vol\\s+p[úu]blic|cloud"
        value: 0.4
        negatable: false
      - pattern: "cobol|as/?400|llegat"
        value: -0.7
        negatable: false
  gold:
    - ad_id: manfred-8419
      language: en
      span: "real-time responses, all orchestrated via **Kubernetes and Docker**.\n* To keep everything synchronized and monitored, they rely on **GitHub Actions, Argo CD, Langfuse,"
      value: 0.6
      derived_from: cue
    - ad_id: manfred-8360
      language: es
      span: "verdad.\n\nEstamos hablando de un entorno de **microservicios orientado a eventos con unos 80 servicios** en total, donde tus nuevas criaturas en Go tendrán que entenderse"
      value: 0.6
      derived_from: cue
    - ad_id: feinaactiva-09202624459
      language: ca
      span: "tecnològics (transformació digital, migració al núvol públic en models IaaS/PaaS/SaaS i evolució d'arquitectures), avaluant de forma crítica les estratègies abans i després"
      value: 0.6
      derived_from: cue
methods_ref: METHODS.md#26-ad-wording-as-signal
