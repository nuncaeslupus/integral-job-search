id: formal_credential
kind: hard
polarity: unipolar
group: requirements
label:
  en: "Formal credential"
  es: "Titulación exigida"
  ca: "Titulació exigida"
definition: >
  Whether a documented qualification gates the role — a degree, a vocational title, a
  professional certificate or a licence to practise — as opposed to an ad that judges
  experience alone. What is at stake is admissibility, not depth: a candidate without
  the paper is refused however well they could do the work.
levels:
  - value: 0.0
    label:
      en: "None stated"
      es: "Ninguna"
      ca: "Cap"
    tell: "the ad names no qualification at all"
  - value: 0.5
    label:
      en: "Desirable"
      es: "Valorable"
      ca: "Valorable"
    tell: "a title or certificate is 'valorable', 'a plus', 'desirable'"
  - value: 0.9
    label:
      en: "Required"
      es: "Imprescindible"
      ca: "Imprescindible"
    tell: "a named title or certificate stated as required or 'imprescindible'"
elicitation:
  questions:
    - id: fc_q1
      text:
        en: >
          Tell me about a role where the qualification on paper mattered more than what
          you could actually do — and one where nobody ever asked to see it.
        es: >
          Cuéntame un puesto en el que la titulación sobre el papel pesó más que lo que
          sabías hacer, y otro en el que nadie te la pidió nunca.
        ca: >
          Explica'm una feina on la titulació sobre el paper va pesar més que el que
          sabies fer, i una altra on ningú no te la va demanar mai.
extraction:
  cues:
    en:
      - pattern: "\\b(bachelor'?s|master'?s|university)\\s+degree\\b"
        value: 0.9
      - pattern: "\\bdegree\\s+(in|or\\s+equivalent)\\b"
        value: 0.9
    es:
      - pattern: "\\btitulaci[óo]n\\b"
        value: 0.9
      - pattern: "\\b(grado|ciclo)\\s+(medio|superior)\\b|\\bFP\\b"
        value: 0.9
    ca:
      - pattern: "\\btitulaci[óo]\\b"
        value: 0.9
      - pattern: "\\b(grau|cicle)\\s+(mitj[àa]|superior)\\b"
        value: 0.9
      - pattern: "\\bcertificat\\s+de\\s+professionalitat\\b"
        value: 0.9
      - pattern: "\\b(llicenciatura|diplomatura)\\b"
        value: 0.9
  gold:
    - ad_id: wwr-faire-senior-staff-data-engineer-platform-data-and-analytics
      language: en
      span: "A bachelor's degree in Computer Science/Software Engineering or equivalent industry experience."
      value: 0.9
      derived_from: cue
    - ad_id: feinaactiva-FA92318757
      language: es
      span: "Titulación: Licenciatura, Grado Universitario o Ingeniería (preferiblemente en Filología, Historia, Matemáticas, Biología o carreras afines al ámbito a impartir)."
      value: 0.9
      derived_from: cue
    - ad_id: feinaactiva-09202619629
      language: ca
      span: "• Titulació: Grau/diplomatura universitària homologada en TERÀPIA OCUPACIONAL."
      value: 0.9
      derived_from: cue
methods_ref: METHODS.md#26-ad-wording-as-signal
