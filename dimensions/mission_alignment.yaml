id: mission_alignment
kind: soft
polarity: unipolar
group: growth
label:
  en: Mission alignment
  es: Alineación con la misión
  ca: Alineació amb la missió
definition: >
  Whether the advert says what the work is ultimately for — a named purpose, rather
  than a sector left to infer. It does not say whether that purpose is one
  the candidate wants: an advert states a sector, and whether the sector is a draw
  or a refusal is the candidate's, carried by their weight on this dimension and by
  the knockouts recorded in step 2. Encoding that judgement here would put one
  person's ethics in the extractor and score every other candidate against them.
levels:
  - value: 0.0
    label:
      en: "Not stated"
      es: "No se dice"
      ca: "No es diu"
    tell: "the ad never says what the work is ultimately for"
  - value: 0.7
    label:
      en: "Purpose stated"
      es: "Propósito declarado"
      ca: "Propòsit declarat"
    tell: "health, education, climate, public service, or a mission named and meant"
elicitation:
  questions:
    - id: ma_q1
      text:
        en: >
          Tell me about work you were proud to explain at a family dinner — and any work
          you would not take again.
        es: >
          Cuéntame un trabajo que te enorgullecía explicar en una cena familiar — y
          alguno que no volverías a aceptar.
        ca: >
          Explica'm una feina que t'enorgullia explicar en un sopar familiar — i alguna
          que no tornaries a acceptar.
extraction:
  # Two cues per language, both at the 0.7 rung, and both need the
  # organisation's own statement of its mission (T176). A sector noun on its
  # own is not a purpose — the definition says so ("rather than a sector left
  # to infer") — and a regex cannot tell "healthcare" the purpose from
  # "Healthcare" the benefit, "Educació Infantil" the degree, "Administración
  # Pública" the client, "L'Hospitalet" the town or "sanitaris" the bathroom
  # fittings. Measured on the corpus when this landed, the bare-noun cues
  # settled 0.7 on over thirty adverts that way. So the sector counts where the
  # mission statement names it, never addressed to "you" (a benefit is for the
  # employee; a purpose is for someone else), and every other mention goes to
  # the model, which is what an unsettled dimension is for.
  cues:
    en:
      - pattern: "our\\s+mission\\s+is|mission-?driven|social\\s+impact"
        value: 0.7
        negatable: true
      - pattern: "(?:our\\s+(?:mission|purpose)|we\\s+exist\\s+to)(?:(?!\\byour?\\b)[^.;!?\\n]){0,80}?\\b(?:health\\s*care|health|patients?|hospitals?|medic\\w*|education\\w*|schools?|students?|teachers?|climate|public\\s+services?|public\\s+sector|non-?profits?)"
        value: 0.7
        negatable: false
    es:
      - pattern: "nuestra\\s+misi[óo]n|impacto\\s+social"
        value: 0.7
        negatable: true
      - pattern: "(?:nuestra\\s+misi[óo]n|nuestro\\s+prop[óo]sito|existimos\\s+para)(?:(?!\\b(?:tu|tus|vuestr\\w*)\\b)[^.;!?\\n]){0,80}?\\b(?:sanidad|salud|sanitari\\w*|pacientes?|hospital(?:es)?|m[ée]dic\\w*|medicina|educaci[óo]n|educativ\\w*|escuelas?|estudiantes?|alumn\\w*|clima|clim[áa]tic\\w*|servicios?\\s+p[úu]blicos?|sector\\s+p[úu]blico|administraci[óo]n\\s+p[úu]blica|sin\\s+[áa]nimo\\s+de\\s+lucro)"
        value: 0.7
        negatable: false
    ca:
      - pattern: "la\\s+nostra\\s+missi[óo]|impacte\\s+social"
        value: 0.7
        negatable: true
      - pattern: "(?:la\\s+nostra\\s+missi[óo]|el\\s+nostre\\s+prop[òo]sit|existim\\s+per)(?:(?!\\b(?:teu|teus|teva|teves|vostr\\w*)\\b)[^.;!?\\n]){0,80}?\\b(?:salut|sanitat|sanitari\\w*|pacients?|hospitals?|m[èe]dic\\w*|medicina|educaci[óo]|educatiu\\w*|educativ\\w*|escoles?|estudiants?|alumn\\w*|clima|clim[àa]tic\\w*|serveis?\\s+p[úu]blics?|sector\\s+p[úu]blic|administraci[óo]\\s+p[úu]blica|sense\\s+[àa]nim\\s+de\\s+lucre)"
        value: 0.7
        negatable: false
  gold:
    - ad_id: wwr-stripe-backend-engineer-core-technology
      language: en
      span: "Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented"
      value: 0.7
      derived_from: cue
    - ad_id: feinaactiva-FA92318673
      language: ca
      span: "cultura corporativa sòlida. La nostra missió és proporcionar servei, gaudi i lleure perquè milions de persones gaudeixin de les seves vacances."
      value: 0.7
      derived_from: cue
methods_ref: METHODS.md#24-reaction-elicitation-on-real-ad-text
