id: compensation_transparency
kind: soft
polarity: unipolar
group: terms
label:
  en: Pay transparency
  es: Transparencia salarial
  ca: Transparència salarial
definition: >
  Whether the ad states what the role pays — a stated band, a figure, or nothing but
  'competitive'. A property of the ad's wording, not of the amount.
levels:
  - value: 0.0
    label:
      en: "Silent on pay"
      es: "No dice nada del sueldo"
      ca: "No en diu res, del sou"
    tell: "the ad never mentions money at all"
  - value: 0.2
    label:
      en: "Described, never quantified"
      es: "«Competitivo», sin cifra"
      ca: "«Competitiu», sense xifra"
    tell: "'competitive salary', 'salary according to experience' — a word where a number should be"
  - value: 0.9
    label:
      en: "A figure or a band"
      es: "Una cifra o una banda"
      ca: "Una xifra o una forquilla"
    tell: "an actual amount or range the reader can act on"
elicitation:
  questions:
    - id: ct_q1
      text:
        en: >
          Describe how pay came up in your last hiring process. Who named a number
          first, and at what point?
        es: >
          Describe cómo salió el tema del salario en tu último proceso. ¿Quién dio una
          cifra primero y en qué momento?
        ca: >
          Descriu com va sortir el tema del salari al teu últim procés. Qui va donar una
          xifra primer i en quin moment?
extraction:
  cues:
    en:
      - pattern: "salary\\s+range|\\$\\s?\\d{2,3},?\\d{3}"
        value: 0.9
        negatable: false
      - pattern: "competitive\\s+salary"
        value: 0.1
        negatable: false
      - pattern: "depending\\s+on\\s+experience"
        value: 0.2
        negatable: false
    es:
      - pattern: "\\d{2}\\.\\d{3}\\s*[-–a]\\s*\\d{2}\\.\\d{3}|\\d{2}\\.\\d{3}\\s*€"
        value: 0.9
        negatable: false
      - pattern: "salario\\s+competitivo"
        value: 0.1
        negatable: false
      - pattern: "seg[úu]n\\s+(val[ií]a|experiencia)"
        value: 0.2
        negatable: false
    ca:
      - pattern: "salari\\s+mensual\\s+brut\\s*\\d|\\d{2}\\.\\d{3}\\s*€"
        value: 0.9
        negatable: false
      - pattern: "salari\\s+competitiu|retribuci[óo]\\s+competitiva"
        value: 0.1
        negatable: false
      - pattern: "a\\s+convenir"
        value: 0.2
        negatable: false
  gold:
    - ad_id: remotive-2091075
      language: en
      span: "Credits for Outsite locations\n\n- Salary - $45,000 - $50,000 USD + commission"
      value: 0.9
    - ad_id: tecnoempleo-f1561880d27323ff6e45
      language: es
      span: "el segundo semestre de 2026 . - Salario 30.000 - 35.000 brutos anuales - Equipo Macbook o PC a tu elección (con 24/32 GB de RAM y 1 TB de almacenamiento) - Suscripción"
      value: 0.9
    - ad_id: feinaactiva-09202623802
      language: ca
      span: "Contracte laboral indefinit\n\nJornada completa\n\nSalari mensual brut 3085\n\nAltres dades d'interès: Horari:\n01/07 - 15/9 de 08:15 a 15:00\n16/09 - 30/06 de 08:15 a 18:30 (1.15 dinar)"
      value: 0.9
methods_ref: METHODS.md#26-ad-wording-as-signal
