id: learning_support
kind: soft
polarity: unipolar
group: growth
label:
  en: Learning support
  es: Apoyo a la formación
  ca: Suport a la formació
definition: >
  What the employer puts behind learning: paid training, certification budgets,
  conference or language classes, and time to use them.
levels:
  - value: 0.0
    label:
      en: "Nothing"
      es: "Nada"
      ca: "Res"
    tell: "no training, budget or study time appears"
  - value: 0.5
    label:
      en: "Mentioned, nothing named"
      es: "Se menciona, sin concretar"
      ca: "Se'n parla, sense concretar"
    tell: "'continuous learning' or 'professional development' with nothing attached"
  - value: 0.8
    label:
      en: "Paid and specific"
      es: "Pagado y concreto"
      ca: "Pagat i concret"
    tell: "a training budget, paid certifications, language classes, or conference days"
elicitation:
  questions:
    - id: ls_q1
      text:
        en: >
          Tell me about the last skill you learned for work. Who paid for it, and when
          did you study?
        es: >
          Cuéntame la última habilidad que aprendiste para el trabajo. ¿Quién la pagó y
          cuándo estudiabas?
        ca: >
          Explica'm l'última habilitat que vas aprendre per a la feina. Qui la va pagar
          i quan estudiaves?
extraction:
  cues:
    en:
      - pattern: "(training|learning|certification|education)\\s+(budget|allowance|stipend|reimbursement)|paid\\s+(training|certifications?|conferences?)|conference\\s+days"
        value: 0.8
        negatable: true
      - pattern: "continuous\\s+learning|free\\s+(english|language)\\s+lessons|professional\\s+(development|growth)|learning\\s+opportunities"
        value: 0.5
        negatable: false
      - pattern: "(we|they)\\s+(pay|fund|sponsor)\\s+[^.]{0,30}(training|certification|conference)"
        value: 0.6
        negatable: false
    # `\bformaci` and not `formaci`: `informació` / `información` contains it,
    # and this dimension is not evidenced by an advert mentioning information.
    # `formació professional` is likewise excluded below — on these boards it
    # names the qualification the candidate must already hold, not anything the
    # employer offers.
    es:
      - pattern: "presupuesto\\s+de\\s+\\bformaci[óo]n|plan\\s+de\\s+\\bformaci[óo]n|pla\\s+de\\s+\\bformaci[óo]|\\bformaci[óo]n?\\s+(a\\s+cargo\\s+de\\s+la\\s+empresa|a\\s+c[àa]rrec\\s+de\\s+l['’]?\\s*empresa|financiada|finan[çc]ada|pagada|especializada|especialitzada)|\\bformacions\\s+especialitzades|\\bformaci\\w*\\s+(i|y)\\s+certificaci"
        value: 0.8
        negatable: true
      - pattern: "\\bformaci\\w*\\s+(continua|continuada|cont[íi]nua|internas?|permanentes?)|acceso\\s+(continuo\\s+)?a\\s+(la\\s+)?\\bformaci|acc[ée]s\\s+(continu\\s+)?a\\s+(la\\s+)?\\bformaci|\\bformaci\\w*\\s+(personalizad|personalitzad|t[éeè]cnic|a\\s+medida|a\\s+mida)"
        value: 0.7
        negatable: false
      - pattern: "clases\\s+de\\s+ingl[ée]s|classes\\s+d['’]angl[èe]s|certificacions?\\s+(pagadas|financiadas|pagades|finan[çc]ades)|desarrollo\\s+profesional|desenvolupament\\s+professional|crecimiento\\s+profesional|creixement\\s+professional"
        value: 0.5
        negatable: false
    ca:
      - pattern: "pla\\s+de\\s+\\bformaci[óo]|pressupost\\s+de\\s+\\bformaci[óo]|presupuesto\\s+de\\s+\\bformaci[óo]n|\\bformaci[óo]n?\\s+(a\\s+c[àa]rrec\\s+de\\s+l['’]?\\s*empresa|a\\s+cargo\\s+de\\s+la\\s+empresa|finan[çc]ada|financiada|pagada|especialitzada|especializada)|\\bformacions\\s+especialitzades|\\bformaci\\w*\\s+(i|y)\\s+certificaci"
        value: 0.8
        negatable: true
      - pattern: "\\bformaci\\w*\\s+(cont[íi]nua|continuada|continua|internes?|internas?|permanents?|permanentes?)|acc[ée]s\\s+(continu\\s+)?a\\s+(la\\s+)?\\bformaci|acceso\\s+(continuo\\s+)?a\\s+(la\\s+)?\\bformaci|\\bformaci\\w*\\s+(personalitzad|personalizad|t[éeè]cnic|a\\s+mida|a\\s+medida)"
        value: 0.7
        negatable: false
      - pattern: "classes\\s+d['’]angl[èe]s|clases\\s+de\\s+ingl[ée]s|certificacions?\\s+(pagades|finan[çc]ades|pagadas|financiadas)|desenvolupament\\s+professional|desarrollo\\s+profesional|creixement\\s+professional|crecimiento\\s+profesional"
        value: 0.5
        negatable: false
  gold:
    - ad_id: manfred-8456
      language: en
      span: "family.\n\n**🗣️ Continuous learning**: Free English and Spanish lessons and ongoing professional development opportunities.\n\n**💻 Pro Equipment**:"
      value: 0.8
      derived_from: cue
    - ad_id: manfred-8379
      language: es
      span: "médico.**\n* 📚 **Presupuesto de formación personal**: 1.000 € para que sigas aprendiendo.\n* 💻 **MacBook** para"
      value: 0.8
      derived_from: cue
    - ad_id: feinaactiva-FA92322529
      language: ca
      span: "horari flexible\nFormació contínua i oportunitats de desenvolupament professional\nAmbient de treball col·laboratiu i dinàmic"
      value: 0.8
      derived_from: cue
methods_ref: METHODS.md#26-ad-wording-as-signal
