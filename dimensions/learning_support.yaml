id: learning_support
kind: soft
polarity: unipolar
group: growth
label:
  en: Learning support
  es: Apoyo a la formación
  ca: Suport a la formació
definition: >
  What the employer puts behind learning: paid training, certification budgets,
  conference or language classes, and time to use them.
levels:
  - value: 0.0
    label:
      en: "Nothing"
      es: "Nada"
      ca: "Res"
    tell: "no training, budget or study time appears"
  - value: 0.5
    label:
      en: "Mentioned, nothing named"
      es: "Se menciona, sin concretar"
      ca: "Se'n parla, sense concretar"
    tell: "'continuous learning' or 'professional development' with nothing attached"
  - value: 0.8
    label:
      en: "Paid and specific"
      es: "Pagado y concreto"
      ca: "Pagat i concret"
    tell: "a training budget, paid certifications, language classes, or conference days"
elicitation:
  questions:
    - id: ls_q1
      text:
        en: >
          Tell me about the last skill you learned for work. Who paid for it, and when
          did you study?
        es: >
          Cuéntame la última habilidad que aprendiste para el trabajo. ¿Quién la pagó y
          cuándo estudiabas?
        ca: >
          Explica'm l'última habilitat que vas aprendre per a la feina. Qui la va pagar
          i quan estudiaves?
extraction:
  cues:
    en:
      - pattern: "(training|learning|certification|education)\\s+(budget|allowance|stipend|reimbursement)"
        value: 0.8
        negatable: true
      - pattern: "continuous\\s+learning|free\\s+(english|language)\\s+lessons"
        value: 0.7
        negatable: false
      - pattern: "(we|they)\\s+(pay|fund|sponsor)\\s+[^.]{0,30}(training|certification|conference)"
        value: 0.6
        negatable: false
    es:
      - pattern: "presupuesto\\s+de\\s+formaci[óo]n|plan\\s+de\\s+formaci[óo]n"
        value: 0.8
        negatable: true
      - pattern: "formaci[óo]n\\s+(continua|financiada|pagada|a\\s+cargo\\s+de\\s+la\\s+empresa)"
        value: 0.7
        negatable: false
      - pattern: "clases\\s+de\\s+ingl[ée]s|certificaciones?\\s+(pagadas|financiadas)"
        value: 0.5
        negatable: false
    ca:
      - pattern: "pla\\s+de\\s+formaci[óo]|formaci[óo]\\s+cont[ií]nua"
        value: 0.8
        negatable: true
      - pattern: "formaci[óo]\\s+(a\\s+c[àa]rrec\\s+de\\s+l'empresa|finançada)"
        value: 0.7
        negatable: false
      - pattern: "classes\\s+d'angl[èe]s"
        value: 0.5
        negatable: false
  gold:
    - ad_id: manfred-8456
      language: en
      span: "family.\n\n**🗣️ Continuous learning**: Free English and Spanish lessons and ongoing professional development opportunities.\n\n**💻 Pro Equipment**:"
      value: 0.8
    - ad_id: manfred-8379
      language: es
      span: "médico.**\n* 📚 **Presupuesto de formación personal**: 1.000 € para que sigas aprendiendo.\n* 💻 **MacBook** para"
      value: 0.8
    - ad_id: feinaactiva-FA92322529
      language: ca
      span: "horari flexible\nFormació contínua i oportunitats de desenvolupament professional\nAmbient de treball col·laboratiu i dinàmic"
      value: 0.8
methods_ref: METHODS.md#26-ad-wording-as-signal
